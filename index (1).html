<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DemandFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --sb:#0F172A;--sb2:#1E293B;--sbt:#94A3B8;--sba:#2563EB;--sbab:rgba(37,99,235,.15);
  --hbg:#fff;--cbg:#F1F5F9;--card:#fff;--brd:#E2E8F0;
  --t1:#1E293B;--t2:#64748B;--t3:#94A3B8;
  --blue:#2563EB;--bluel:#EFF6FF;--blueb:#BFDBFE;
  --green:#059669;--greenl:#ECFDF5;--greenb:#A7F3D0;
  --amber:#D97706;--amberl:#FFFBEB;--amberb:#FDE68A;
  --red:#DC2626;--redl:#FEF2F2;--redb:#FECACA;
  --purple:#7C3AED;--purplel:#F5F3FF;--purpleb:#DDD6FE;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--cbg);color:var(--t1);font-size:14px;line-height:1.5}
input,select,textarea,button{font-family:'Inter',sans-serif}
input,select,textarea{border:1px solid var(--brd);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;background:#fff;color:var(--t1);transition:border .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

/* SIDEBAR */
.sb{background:var(--sb);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:220px;z-index:100}
.sb-logo{padding:20px 16px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo-icon{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.sb-logo-text{color:#fff;font-weight:700;font-size:15px}
.sb-logo-sub{color:var(--sbt);font-size:10px;margin-top:1px}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-section{font-size:10px;font-weight:600;color:rgba(148,163,184,.5);text-transform:uppercase;letter-spacing:.8px;padding:8px 8px 4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--sbt);transition:all .15s;margin-bottom:2px;position:relative}
.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-item.active{background:var(--sbab);color:#fff}
.sb-item.active .sb-icon{color:var(--blue)}
.sb-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sb-label{font-size:13px;font-weight:500;flex:1}
.sb-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-badge.blue{background:var(--blue)}
.sb-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px}
.sb-user-name{color:#fff;font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-role{color:var(--sbt);font-size:10px}
.sb-signout{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--sbt);border:none;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.sb-signout:hover{background:rgba(255,255,255,.12);color:#fff}

/* MAIN */
.main{margin-left:220px;display:flex;flex-direction:column;min-height:100vh}
.hdr{background:var(--hbg);border-bottom:1px solid var(--brd);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hdr-left{display:flex;flex-direction:column}
.hdr-title{font-size:16px;font-weight:700;color:var(--t1)}
.hdr-phrase{font-size:11px;color:var(--t2);font-style:italic;max-width:500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:14px}
.hdr-clock{text-align:right}
.hdr-time{font-size:18px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.hdr-date{font-size:10px;color:var(--t3)}
.pomo-toggle{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:var(--bluel);color:var(--blue);border:1px solid var(--blueb);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:all .15s}
.pomo-toggle:hover{background:var(--blue);color:#fff}
.pomo-toggle.active{background:var(--red);border-color:var(--redb);color:#fff}
.content{flex:1;padding:24px}

/* CARDS */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--shadow)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:var(--t1)}
.card-body{padding:20px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1D4ED8}
.btn-secondary{background:transparent;color:var(--t2);border:1px solid var(--brd)}.btn-secondary:hover{background:var(--cbg)}
.btn-danger{background:var(--redl);color:var(--red);border:1px solid var(--redb)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-success{background:var(--greenl);color:var(--green);border:1px solid var(--greenb)}.btn-success:hover{background:var(--green);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:500;white-space:nowrap}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-2-asym{display:grid;grid-template-columns:420px 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* STAT CARD */
.stat{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}
.stat-val{font-size:28px;font-weight:700;margin-bottom:2px}
.stat-label{font-size:12px;color:var(--t2)}

/* DEMAND LIST */
.two-col{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 60px - 48px)}
.panel-left{background:var(--card);border-right:1px solid var(--brd);display:flex;flex-direction:column}
.panel-right{background:var(--cbg);overflow-y:auto}
.demand-item{padding:12px 14px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.demand-item:hover{background:#F8FAFC}
.demand-item.active{background:var(--bluel);border-left-color:var(--blue)}

/* NOTICES */
.notice-item{padding:16px 20px;border-left:4px solid;margin-bottom:10px;border-radius:0 var(--r) var(--r) 0;background:var(--card);box-shadow:var(--shadow)}

/* PROSPECTS */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kanban-col{background:var(--cbg);border:1px solid var(--brd);border-radius:var(--r);min-width:230px;flex:1}
.kanban-col-header{padding:12px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.kanban-col-title{font-size:12px;font-weight:600}
.kanban-cards{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100px}
.prospect-card{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.prospect-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;cursor:pointer;font-size:22px;color:var(--t3);line-height:1;padding:2px 6px;border-radius:6px}
.modal-close:hover{background:var(--cbg);color:var(--t1)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--brd);display:flex;justify-content:flex-end;gap:8px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* POMODORO WIDGET */
.pomo-widget{position:fixed;bottom:20px;right:20px;z-index:150;width:300px;background:#fff;border:1px solid var(--brd);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.15);display:none;max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;flex-direction:column}
.pomo-widget.show{display:flex}
.pomo-wh{background:var(--sb);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.pomo-wh-title{color:#fff;font-size:13px;font-weight:600}
.pomo-wclose{background:none;border:none;cursor:pointer;color:var(--sbt);font-size:18px;line-height:1}
.pomo-wclose:hover{color:#fff}
.pomo-body{padding:16px}
.pomo-display{text-align:center;margin-bottom:14px}
.pomo-timer{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1}
.pomo-timer.work{color:var(--blue)}
.pomo-timer.break{color:var(--green)}
.pomo-timer.longbreak{color:var(--purple)}
.pomo-mode{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-top:4px}
.pomo-progress{height:4px;background:var(--brd);border-radius:2px;margin-bottom:14px;overflow:hidden;flex-shrink:0}
.pomo-progress-bar{height:4px;border-radius:2px;transition:width .5s;min-width:0}
.pomo-controls{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.pomo-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--brd);background:var(--cbg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pomo-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.pomo-btn.main{width:48px;height:48px;font-size:20px;background:var(--blue);border-color:var(--blue);color:#fff}
.pomo-btn.main:hover{background:#1D4ED8}
.pomo-sessions{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.pomo-dot{width:8px;height:8px;border-radius:50%;background:var(--brd);transition:background .3s}
.pomo-dot.done{background:var(--blue)}
.pomo-dot.current{background:var(--amber)}
.pomo-config{border-top:1px solid var(--brd);padding-top:12px}
.pomo-config-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pomo-cfg-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pomo-cfg-label{font-size:12px;color:var(--t2)}
.pomo-cfg-input{width:60px;text-align:center;padding:4px 6px;font-size:12px}
.pomo-history{margin-top:10px;max-height:80px;overflow-y:auto}
.pomo-hist-item{font-size:11px;color:var(--t3);padding:2px 0;border-bottom:1px solid var(--brd)}

/* CONTENT SPACING */
.content{flex:1;padding:28px 28px 28px 28px;max-width:1100px}
.content-wide{flex:1;padding:28px}
/* When pomodoro open add right space */
body.pomo-open .main{padding-right:320px}
.empty{text-align:center;padding:48px 24px;color:var(--t3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:14px;font-weight:500;color:var(--t2);margin-bottom:4px}
.empty-sub{font-size:12px}

/* TABS */
.tabs{display:flex;gap:4px;padding:12px 14px 0}
.tab{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;color:var(--t2);transition:all .15s;display:flex;align-items:center;gap:5px}
.tab:hover{background:var(--cbg)}
.tab.active{background:var(--bluel);color:var(--blue);border-color:var(--blueb)}
.tab-count{font-size:10px;background:rgba(0,0,0,.08);padding:1px 5px;border-radius:8px}

/* AVATAR */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;user-select:none}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 50%,#0F172A 100%);padding:16px}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,.3)}

/* UTILS */
.flex{display:flex}.aic{align-items:center}.jcsb{justify-content:space-between}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.text-sm{font-size:12px}.text-xs{font-size:11px}.text-muted{color:var(--t2)}.text-faint{color:var(--t3)}
.fw6{font-weight:600}.fw7{font-weight:700}
.w100{width:100%}
.divider{height:1px;background:var(--brd);margin:14px 0}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-size:10px;font-weight:700;padding:0 6px}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'
import{getFirestore,collection,addDoc,query,where,onSnapshot,orderBy,doc,updateDoc,serverTimestamp,getDoc,setDoc,getDocs,deleteDoc,arrayUnion}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'

const firebaseConfig={apiKey:"AIzaSyByb5xL5fnmW3wcc7OU2BhuCUf0eTxjYuI",authDomain:"demanda-jsr.firebaseapp.com",projectId:"demanda-jsr",storageBucket:"demanda-jsr.firebasestorage.app",messagingSenderId:"557935888143",appId:"1:557935888143:web:2de3954f8769430488e07a",measurementId:"G-MCHE0PE115"}
const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

// ── ESTADO ────────────────────────────────────────────────────
let CU=null,CP=null
let demands=[],notices=[],prospects=[],users=[]
let unsubs=[]
let section='demands'
let demandsTab='internal',selectedDemand=null,demandPanel=null
let pomoVisible=false
let pomoInterval=null
let pomoState={mode:'work',running:false,seconds:25*60,session:0,history:[],cfg:{work:25,short:5,long:15}}
let modalOpen=null

// ── FRASES MOTIVACIONAIS ──────────────────────────────────────
const FRASES=[
  "O sucesso é a soma de pequenos esforços repetidos dia após dia. — Robert Collier",
  "Cada cliente bem atendido é uma parceria construída para durar.",
  "A excelência não é um ato, é um hábito. — Aristóteles",
  "Organize-se hoje para colher os resultados amanhã.",
  "Uma equipe alinhada move montanhas.",
  "O atendimento de qualidade transforma clientes em fãs.",
  "Foco, disciplina e consistência: a fórmula do sucesso.",
  "Cada problema resolvido é uma oportunidade de fidelizar.",
  "Trabalhe com propósito. Os resultados virão como consequência.",
  "Nenhum detalhe é pequeno quando se trata de encantar o cliente.",
  "A organização é o primeiro passo para a produtividade.",
  "Grandes conquistas começam com pequenas ações bem feitas.",
  "Seja a razão pela qual alguém confia na sua empresa hoje.",
  "Produtividade não é fazer mais, é fazer o que importa melhor.",
  "O tempo é o recurso mais valioso — use-o com intenção."
]
const FRASE_HOJE=FRASES[new Date().getDate()%FRASES.length]

// ── UTILIDADES ────────────────────────────────────────────────
function ago(ts){if(!ts)return'...';const d=ts.toDate?ts.toDate():new Date(ts);const m=Math.floor((Date.now()-d)/60000);if(m<1)return'agora mesmo';if(m<60)return m+'min atrás';const h=Math.floor(m/60);if(h<24)return h+'h atrás';return Math.floor(h/24)+'d atrás'}
function ini(n=''){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function fmtMoney(v){if(!v)return'';return'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2})}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function AV_COLORS(name){const i=(name?.charCodeAt(0)||0)%5;return[['#2563EB','#EFF6FF'],['#059669','#ECFDF5'],['#7C3AED','#F5F3FF'],['#D97706','#FFFBEB'],['#DC2626','#FEF2F2']][i]}
function av(name,sz=32){const[c,b]=AV_COLORS(name);const d=document.createElement('div');d.className='av';Object.assign(d.style,{width:sz+'px',height:sz+'px',background:b,color:c,fontSize:(sz*.36)+'px'});d.textContent=ini(name);return d}
function el(tag,cls='',style){const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);return e}
function txt(t){return document.createTextNode(t)}
function q(s,ctx=document){return ctx.querySelector(s)}
function append(parent,...children){children.forEach(c=>{if(c!=null)parent.appendChild(typeof c==='string'?document.createTextNode(c):c)});return parent}
function tag_(cfg,text){const s=el('span','tag');Object.assign(s.style,{background:cfg.bg,color:cfg.c,border:`1px solid ${cfg.bd}`});s.textContent=text||cfg.label;return s}

// ── CONFIGS DE STATUS/TIPO ─────────────────────────────────────
const DSTATUS={open:{label:'Aberto',c:'#1D4ED8',bg:'#EFF6FF',bd:'#BFDBFE'},in_progress:{label:'Andamento',c:'#D97706',bg:'#FFFBEB',bd:'#FDE68A'},resolved:{label:'Resolvido',c:'#059669',bg:'#ECFDF5',bd:'#A7F3D0'}}
const DPRIORITY={high:{label:'Alta',c:'#DC2626',bg:'#FEF2F2',bd:'#FECACA'},medium:{label:'Média',c:'#D97706',bg:'#FFFBEB',bd:'#FDE68A'},low:{label:'Baixa',c:'#64748B',bg:'#F8FAFC',bd:'#E2E8F0'}}
const DTYPE={internal:{label:'Interna',icon:'●',c:'#059669',bg:'#ECFDF5',bd:'#A7F3D0'},private:{label:'Privada',icon:'◆',c:'#7C3AED',bg:'#F5F3FF',bd:'#DDD6FE'},restricted:{label:'Restrita',icon:'▲',c:'#DC2626',bg:'#FEF2F2',bd:'#FECACA'}}
const PSTATUS={contato:{label:'Em contato',c:'#2563EB',bg:'#EFF6FF',bd:'#BFDBFE'},proposta:{label:'Proposta enviada',c:'#D97706',bg:'#FFFBEB',bd:'#FDE68A'},aguardando:{label:'Aguardando retorno',c:'#7C3AED',bg:'#F5F3FF',bd:'#DDD6FE'},aceite:{label:'Aceite ✓',c:'#059669',bg:'#ECFDF5',bd:'#A7F3D0'},nao_aceite:{label:'Não aceite',c:'#DC2626',bg:'#FEF2F2',bd:'#FECACA'}}
const NPRIORITY={info:{label:'Informativo',c:'#2563EB',bg:'#EFF6FF',bd:'#BFDBFE',border:'#2563EB'},warning:{label:'Atenção',c:'#D97706',bg:'#FFFBEB',bd:'#FDE68A',border:'#F59E0B'},urgent:{label:'Urgente',c:'#DC2626',bg:'#FEF2F2',bd:'#FECACA',border:'#DC2626'}}

// ── CLOCK ──────────────────────────────────────────────────────
function startClock(){
  function tick(){
    const t=q('#clock-time');const d=q('#clock-date');
    if(!t)return;
    const now=new Date();
    t.textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    d.textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  }
  tick();setInterval(tick,1000);
}

// ── AUDIO ──────────────────────────────────────────────────────
function beep(freq=880,dur=200,vol=0.3){
  try{const ctx=new AudioContext();const osc=ctx.createOscillator();const g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur/1000);osc.start();osc.stop(ctx.currentTime+dur/1000)}catch(e){}
}
function beepDone(){beep(440,150);setTimeout(()=>beep(550,150),180);setTimeout(()=>beep(660,300),360)}
function beepStart(){beep(660,100)}

// ── POMODORO ──────────────────────────────────────────────────
function pomoTotalSecs(){
  if(pomoState.mode==='work')return pomoState.cfg.work*60;
  if(pomoState.mode==='short')return pomoState.cfg.short*60;
  return pomoState.cfg.long*60;
}
function pomoNextMode(){
  if(pomoState.mode==='work'){
    pomoState.session++;
    pomoState.history.unshift({mode:'work',time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
    if(pomoState.history.length>10)pomoState.history.pop();
    if(pomoState.session%4===0){pomoState.mode='long';pomoState.seconds=pomoState.cfg.long*60}
    else{pomoState.mode='short';pomoState.seconds=pomoState.cfg.short*60}
  } else {
    pomoState.mode='work';pomoState.seconds=pomoState.cfg.work*60;
  }
  pomoState.running=false;
  clearInterval(pomoInterval);
  beepDone();
  renderPomo();
}
function pomoTick(){
  if(pomoState.seconds<=0){pomoNextMode();return}
  pomoState.seconds--;
  renderPomoDisplay();
}
function pomoStart(){pomoState.running=true;beepStart();pomoInterval=setInterval(pomoTick,1000);renderPomoControls()}
function pomoPause(){pomoState.running=false;clearInterval(pomoInterval);renderPomoControls()}
function pomoReset(){pomoPause();pomoState.seconds=pomoTotalSecs();renderPomoDisplay();renderPomoControls()}
function pomoSetMode(m){pomoPause();pomoState.mode=m;pomoState.seconds=pomoTotalSecs();renderPomo()}

function renderPomoDisplay(){
  const t=q('#pomo-timer');const p=q('#pomo-progress-bar');
  if(!t)return;
  t.textContent=fmtTime(pomoState.seconds);
  t.className='pomo-timer '+pomoState.mode.replace('short','break').replace('long','longbreak');
  const total=pomoTotalSecs();
  const pct=((total-pomoState.seconds)/total)*100;
  if(p)p.style.width=pct+'%';
  if(p)p.style.background=pomoState.mode==='work'?'var(--blue)':pomoState.mode==='short'?'var(--green)':'var(--purple)';
}
function renderPomoControls(){
  const c=q('#pomo-controls');if(!c)return;c.innerHTML='';
  const resetB=el('button','pomo-btn');resetB.textContent='↺';resetB.title='Reiniciar';resetB.onclick=pomoReset;
  const mainB=el('button','pomo-btn main');mainB.textContent=pomoState.running?'⏸':'▶';mainB.onclick=()=>pomoState.running?pomoPause():pomoStart();
  const skipB=el('button','pomo-btn');skipB.textContent='⏭';skipB.title='Próximo';skipB.onclick=pomoNextMode;
  append(c,resetB,mainB,skipB);
}
function renderPomoSessions(){
  const c=q('#pomo-sessions');if(!c)return;c.innerHTML='';
  for(let i=0;i<4;i++){const d=el('div','pomo-dot');if(i<pomoState.session%4)d.classList.add('done');if(i===pomoState.session%4&&pomoState.mode==='work')d.classList.add('current');c.appendChild(d)}
}
function renderPomoHistory(){
  const c=q('#pomo-history');if(!c)return;c.innerHTML='';
  if(pomoState.history.length===0){const p=el('p','');p.style.fontSize='11px';p.style.color='var(--t3)';p.textContent='Nenhuma sessão ainda.';c.appendChild(p);return}
  pomoState.history.forEach(h=>{const i=el('div','pomo-hist-item');i.textContent=`✓ Sessão de trabalho concluída às ${h.time}`;c.appendChild(i)});
}
function renderPomo(){
  const w=q('#pomo-widget');if(!w)return;
  w.className='pomo-widget'+(pomoVisible?' show':'');
  renderPomoDisplay();renderPomoControls();renderPomoSessions();renderPomoHistory();
  // config
  ['work','short','long'].forEach(k=>{const inp=q(`#pomo-cfg-${k}`);if(inp){inp.value=pomoState.cfg[k];inp.oninput=e=>{const v=parseInt(e.target.value)||1;pomoState.cfg[k]=v;if(pomoState.mode===k||(k==='short'&&pomoState.mode==='short')||(k==='long'&&pomoState.mode==='long')){pomoReset()}}}}); 
}

// ── SUBSCRIPTIONS ─────────────────────────────────────────────
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];
  const isA=CP?.role==='admin';
  // Demands
  const demQs=[
    query(collection(db,'demands'),where('type','==','internal'),orderBy('createdAt','desc')),
    query(collection(db,'demands'),where('type','==','private'),where('createdBy','==',CU.uid),orderBy('createdAt','desc')),
  ];
  if(isA)demQs.push(query(collection(db,'demands'),where('type','==','restricted'),orderBy('createdAt','desc')));
  const demMap={};
  demQs.forEach(q=>unsubs.push(onSnapshot(q,snap=>{snap.docs.forEach(d=>{demMap[d.id]={id:d.id,...d.data()}});demands=Object.values(demMap).sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));updateSidebarBadges();if(section==='demands')refreshSection()})));
  // Notices
  unsubs.push(onSnapshot(query(collection(db,'notices'),orderBy('createdAt','desc')),snap=>{notices=snap.docs.map(d=>({id:d.id,...d.data()}));updateSidebarBadges();if(section==='notices')refreshSection()}));
  // Prospects
  unsubs.push(onSnapshot(query(collection(db,'prospects'),orderBy('createdAt','desc')),snap=>{prospects=snap.docs.map(d=>({id:d.id,...d.data()}));updateSidebarBadges();if(section==='prospects')refreshSection()}));
  // Users
  getDocs(collection(db,'users')).then(snap=>{users=snap.docs.map(d=>({id:d.id,...d.data()}))});
}
function updateSidebarBadges(){const sb=q('.sb');if(!sb)return;renderSidebarBadges()}
function renderSidebarBadges(){
  // Update badges without full re-render
  const items=document.querySelectorAll('.sb-item');
  items.forEach(it=>{const lbl=it.querySelector('.sb-label');if(!lbl)return;
    const txt=lbl.textContent;
    it.querySelectorAll('.sb-badge').forEach(b=>b.remove());
    if(txt==='Demandas'){const v=demands.filter(d=>d.status==='open').length;if(v>0){const b=el('span','sb-badge');b.textContent=v;it.appendChild(b)}}
    if(txt==='Avisos'){const v=notices.filter(n=>!n.readBy?.includes(CU.uid)).length;if(v>0){const b=el('span','sb-badge');b.textContent=v;it.appendChild(b)}}
    if(txt==='Prospects'){const v=prospects.filter(p=>['contato','proposta','aguardando'].includes(p.status)).length;if(v>0){const b=el('span','sb-badge blue');b.textContent=v;it.appendChild(b)}}
  });
}
function refreshSection(){
  const mc=q('#main-content');if(!mc)return;mc.innerHTML='';
  if(section==='demands')mc.appendChild(renderDemands());
  else if(section==='notices')mc.appendChild(renderNotices());
  else if(section==='prospects')mc.appendChild(renderProspects());
  else if(section==='users')mc.appendChild(renderUsers());
}

// ── RENDER APP ────────────────────────────────────────────────
function renderApp(){
  const root=q('#app');root.innerHTML='';
  const wrapper=el('div','app');
  wrapper.appendChild(renderSidebar());
  const main=el('div','main');
  main.appendChild(renderHeader());
  const content=el('div','');content.id='main-content';
  if(section==='demands')content.appendChild(renderDemands());
  else if(section==='notices')content.appendChild(renderNotices());
  else if(section==='prospects')content.appendChild(renderProspects());
  else if(section==='users')content.appendChild(renderUsers());
  main.appendChild(content);
  wrapper.appendChild(main);
  root.appendChild(wrapper);
  // Pomo widget
  let pw=q('#pomo-widget');if(pw)pw.remove();
  buildPomoWidget();renderPomo();
  startClock();
}

// ── AUTH ──────────────────────────────────────────────────────
onAuthStateChanged(auth,async fu=>{
  if(fu){
    const snap=await getDoc(doc(db,'users',fu.uid));
    if(snap.exists()){CU=fu;CP=snap.data();subscribe();renderApp()}
    else{CU=null;CP=null;renderLogin()}
  } else{
    unsubs.forEach(u=>u());CU=null;CP=null;demands=[];notices=[];prospects=[];renderLogin();
  }
});
</script>
</body>
</html>
