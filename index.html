<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DemandFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --sb:#0F172A;--sbt:#94A3B8;--sbab:rgba(37,99,235,.12);
  --hbg:#fff;--cbg:#F1F5F9;--card:#fff;--brd:#E2E8F0;
  --t1:#1E293B;--t2:#64748B;--t3:#94A3B8;
  --blue:#2563EB;--bluel:#EFF6FF;--blueb:#BFDBFE;
  --green:#059669;--greenl:#ECFDF5;--greenb:#A7F3D0;
  --amber:#D97706;--amberl:#FFFBEB;--amberb:#FDE68A;
  --red:#DC2626;--redl:#FEF2F2;--redb:#FECACA;
  --purple:#7C3AED;--purplel:#F5F3FF;--purpleb:#DDD6FE;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.08);
  --r:10px;--sb-w:220px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--cbg);color:var(--t1);font-size:14px;overflow-x:hidden}
input,select,textarea,button{font-family:'Inter',sans-serif}
input,select,textarea{border:1px solid var(--brd);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;background:#fff;color:var(--t1);transition:border .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}

/* ── SIDEBAR ── */
.sb{width:var(--sb-w);background:var(--sb);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:100}
.sb-logo{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo-icon{width:32px;height:32px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.sb-logo-name{color:#fff;font-weight:700;font-size:14px}
.sb-logo-sub{color:var(--sbt);font-size:10px}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-sec{font-size:10px;font-weight:600;color:rgba(148,163,184,.45);text-transform:uppercase;letter-spacing:.8px;padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--sbt);transition:all .15s;margin-bottom:1px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--sbab);color:#fff}
.nav-item.on .ni-icon{color:var(--blue)}
.ni-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.ni-label{font-size:13px;font-weight:500;flex:1}
.ni-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;line-height:1.6}
.ni-badge.info{background:var(--blue)}
.sb-foot{padding:10px 8px;border-top:1px solid rgba(255,255,255,.06)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.sb-uname{color:#fff;font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{color:var(--sbt);font-size:10px}
.sb-out{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--sbt);border:none;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.sb-out:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── MAIN ── */
.main{margin-left:var(--sb-w);display:flex;flex-direction:column;min-height:100vh}

/* ── HEADER ── */
.hdr{background:#fff;border-bottom:1px solid var(--brd);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-shrink:0}
.hdr-l{display:flex;flex-direction:column;gap:1px}
.hdr-title{font-size:15px;font-weight:700;color:var(--t1)}
.hdr-phrase{font-size:11px;color:var(--t2);font-style:italic;max-width:480px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:12px}
.hdr-clock{text-align:right;line-height:1.2}
.hdr-time{font-size:17px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.hdr-date{font-size:10px;color:var(--t3)}
.pomo-btn-hdr{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:8px;background:var(--bluel);color:var(--blue);border:1px solid var(--blueb);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;white-space:nowrap;transition:all .15s}
.pomo-btn-hdr:hover,.pomo-btn-hdr.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pomo-btn-hdr.running{background:var(--red);color:#fff;border-color:var(--redb)}

/* ── PAGE WRAPPER ── */
.page{flex:1;padding:28px;width:100%}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:14px 20px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;color:var(--t1)}
.card-b{padding:20px}

/* ── BUTTONS ── */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover:not(:disabled){background:#1D4ED8}
.btn-s{background:transparent;color:var(--t2);border:1px solid var(--brd)}.btn-s:hover:not(:disabled){background:var(--cbg);color:var(--t1)}
.btn-d{background:var(--redl);color:var(--red);border:1px solid var(--redb)}.btn-d:hover:not(:disabled){background:var(--red);color:#fff}
.btn-g{background:var(--greenl);color:var(--green);border:1px solid var(--greenb)}.btn-g:hover:not(:disabled){background:var(--green);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:500;white-space:nowrap;border:1px solid transparent}

/* ── AVATAR ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;user-select:none}

/* ── STAT CARDS ── */
.stats-row{display:grid;gap:14px;margin-bottom:24px}
.stats-3{grid-template-columns:repeat(3,1fr)}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stat-c{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);border-left:3px solid}
.stat-v{font-size:30px;font-weight:700;line-height:1;margin-bottom:4px}
.stat-l{font-size:12px;color:var(--t2)}

/* ── DEMANDAS LAYOUT ── */
.dem-wrap{display:flex;flex:1;gap:0;min-height:calc(100vh - 56px)}
.dem-left{width:360px;flex-shrink:0;background:var(--card);border-right:1px solid var(--brd);display:flex;flex-direction:column;min-height:100%}
.dem-right{flex:1;overflow-y:auto;background:var(--cbg)}
.dem-item{padding:12px 16px;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .1s;border-left:3px solid transparent;display:flex;flex-direction:column;gap:4px}
.dem-item:hover{background:#F8FAFC}
.dem-item.sel{background:var(--bluel);border-left-color:var(--blue)}
.dem-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.dem-stat{border-radius:8px;padding:8px 10px;text-align:center}
.dem-stat-v{font-size:20px;font-weight:700;line-height:1}
.dem-stat-l{font-size:10px;font-weight:500;margin-top:2px}
.dem-tabs{display:flex;gap:3px;padding:8px 14px 0}
.dem-tab{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--brd);color:var(--t2);background:transparent;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .15s}
.dem-tab.on{font-weight:600}
.dem-search{padding:8px 14px;display:flex;gap:7px}
.dem-list{flex:1;overflow-y:auto}

/* ── AVISOS LAYOUT ── */
.notices-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.notice-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);border-top:3px solid;overflow:hidden}
.notice-card-h{padding:14px 18px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.notice-card-b{padding:0 18px 14px}
.notice-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:3px}

/* ── PROSPECTS LAYOUT ── */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kb-col{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);width:220px;flex-shrink:0;box-shadow:var(--sh)}
.kb-col-h{padding:12px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);z-index:1;border-radius:var(--r) var(--r) 0 0}
.kb-col-title{font-size:12px;font-weight:600;flex:1}
.kb-col-count{font-size:10px;font-weight:700;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:10px;padding:0 6px}
.kb-cards{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}
.kb-card{background:var(--cbg);border:1px solid var(--brd);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s}
.kb-card:hover{box-shadow:var(--sh2);transform:translateY(-1px);background:#fff}
.kb-card-name{font-size:13px;font-weight:600;margin-bottom:3px;color:var(--t1)}
.kb-card-sub{font-size:11px;color:var(--t2);margin-bottom:6px}
.kb-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.kb-empty{font-size:11px;color:var(--t3);text-align:center;padding:16px 8px}

/* ── USUÁRIOS LAYOUT ── */
.users-wrap{display:grid;grid-template-columns:440px 1fr;gap:20px;align-items:start}
.user-list-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--brd)}
.user-list-item:last-child{border-bottom:none}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal-h{padding:20px 24px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:15px;font-weight:700}
.modal-x{background:none;border:none;cursor:pointer;font-size:22px;color:var(--t3);line-height:1;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--cbg);color:var(--t1)}
.modal-b{padding:20px 24px}
.modal-f{padding:14px 24px;border-top:1px solid var(--brd);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.form-g{margin-bottom:14px}
.form-l{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── POMODORO ── */
.pomo-panel{position:fixed;right:0;top:56px;bottom:0;width:300px;background:#fff;border-left:1px solid var(--brd);z-index:90;display:none;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .25s}
.pomo-panel.on{display:flex;transform:translateX(0)}
.main.pomo-on{margin-right:300px}
.pomo-ph{background:var(--sb);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pomo-ph-title{color:#fff;font-size:13px;font-weight:600}
.pomo-pb{padding:20px;overflow-y:auto;flex:1}
.pomo-modes{display:flex;gap:4px;margin-bottom:16px;background:var(--cbg);padding:3px;border-radius:9px}
.pomo-modebt{flex:1;padding:6px;border-radius:7px;font-size:11px;font-weight:500;border:none;cursor:pointer;font-family:inherit;color:var(--t2);background:transparent;transition:all .15s}
.pomo-modebt.on{background:#fff;color:var(--t1);font-weight:600;box-shadow:var(--sh)}
.pomo-display{text-align:center;padding:10px 0 16px}
.pomo-timer{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:3px;line-height:1;margin-bottom:6px}
.pomo-timer.work{color:var(--blue)}
.pomo-timer.short{color:var(--green)}
.pomo-timer.long{color:var(--purple)}
.pomo-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)}
.pomo-bar{height:5px;background:var(--brd);border-radius:3px;margin-bottom:16px;overflow:hidden}
.pomo-bar-fill{height:5px;border-radius:3px;transition:width .5s;width:0%}
.pomo-ctrl{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.pomo-cbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--brd);background:var(--cbg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pomo-cbtn:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.pomo-cbtn.play{width:52px;height:52px;font-size:22px;background:var(--blue);border-color:var(--blue);color:#fff}
.pomo-cbtn.play:hover{background:#1D4ED8}
.pomo-cbtn.play.pause{background:var(--amber);border-color:var(--amber)}
.pomo-dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.pomo-dot{width:9px;height:9px;border-radius:50%;background:var(--brd)}
.pomo-dot.done{background:var(--blue)}.pomo-dot.cur{background:var(--amber)}
.pomo-divider{height:1px;background:var(--brd);margin-bottom:14px}
.pomo-cfg-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.pomo-cfg-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pomo-cfg-l{font-size:12px;color:var(--t2)}
.pomo-cfg-i{width:58px;text-align:center;padding:5px;font-size:12px}
.pomo-hist{margin-top:14px}
.pomo-hist-item{font-size:11px;color:var(--t3);padding:4px 0;border-bottom:1px solid var(--brd)}

/* ── DETAIL PANEL ── */
.detail-wrap{padding:28px;max-width:800px}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;color:var(--t3)}
.empty-icon{font-size:42px;margin-bottom:14px}
.empty-t{font-size:14px;font-weight:500;color:var(--t2);margin-bottom:4px}
.empty-s{font-size:12px}

/* ── LOGIN ── */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A,#1E3A5F 50%,#0F172A);padding:16px}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.3)}

/* ── UTILS ── */
.flex{display:flex}.aic{align-items:center}.jcsb{justify-content:space-between}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.fw5{font-weight:500}.fw6{font-weight:600}.fw7{font-weight:700}
.f11{font-size:11px}.f12{font-size:12px}.f13{font-size:13px}
.tc2{color:var(--t2)}.tc3{color:var(--t3)}
.w100{width:100%}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'

const cfg={apiKey:"AIzaSyByb5xL5fnmW3wcc7OU2BhuCUf0eTxjYuI",authDomain:"demanda-jsr.firebaseapp.com",projectId:"demanda-jsr",storageBucket:"demanda-jsr.firebasestorage.app",messagingSenderId:"557935888143",appId:"1:557935888143:web:2de3954f8769430488e07a"}
const fb=initializeApp(cfg);const auth=getAuth(fb);const db=getFirestore(fb)

// ── ESTADO ──────────────────────────────────────────────────
let CU=null,CP=null,sec='demands',unsubs=[]
let demands=[],notices=[],prospects=[],users=[]

  neg_mensalidade:{l:'Neg. Mensalidade',c:'#D97706',bg:'#FFFBEB',bd:'#FDE68A'},

}
const PSTC={
  com_interacao:{l:'Com interação',c:'#059669',bg:'#ECFDF5',bd:'#A7F3D0'},
  sem_interacao:{l:'Sem interação',c:'#DC2626',bg:'#FEF2F2',bd:'#FECACA'}

let clockInterval=null
function startClock(){

// ── BEEP ────────────────────────────────────────────────────
const beep=(f=880,d=200,v=.3)=>{try{const ctx=new AudioContext();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d/1e3);o.start();o.stop(ctx.currentTime+d/1e3)}catch(e){}}
const beepDone=()=>{beep(440,150);setTimeout(()=>beep(550,150),180);setTimeout(()=>beep(660,300),360)}

// ── POMODORO ────────────────────────────────────────────────
const pomoTotal=()=>({work:PS.cfg.work*60,short:PS.cfg.short*60,long:PS.cfg.long*60}[PS.mode])
function pomoNext(){
  if(PS.mode==='work'){PS.sess++;PS.hist.unshift(new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));if(PS.hist.length>8)PS.hist.pop();PS.mode=PS.sess%4===0?'long':'short'}
  else PS.mode='work';
  PS.secs=pomoTotal();PS.on=false;clearInterval(pomoInt);beepDone();updatePomoDisplay();updatePomoCtrl();updatePomoDots();updatePomoHist();
}
function pomoTick(){if(PS.secs<=0){pomoNext();return}PS.secs--;updatePomoDisplay()}
const pomoStart=()=>{PS.on=true;pomoInt=setInterval(pomoTick,1e3);beep(660,100);updatePomoCtrl()}
const pomoPause=()=>{PS.on=false;clearInterval(pomoInt);updatePomoCtrl()}
const pomoReset=()=>{pomoPause();PS.secs=pomoTotal();updatePomoDisplay();updatePomoCtrl()}
const pomoSetMode=m=>{pomoPause();PS.mode=m;PS.secs=pomoTotal();updatePomoDisplay();updatePomoCtrl();updatePomoDots();document.querySelectorAll('.pomo-modebt').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}

function updatePomoDisplay(){
  const t=document.getElementById('pomo-timer');const b=document.getElementById('pomo-bar-fill');const l=document.getElementById('pomo-label');
  if(!t)return;
  t.textContent=fmtT(PS.secs);t.className='pomo-timer '+PS.mode;
  const tot=pomoTotal();const pct=((tot-PS.secs)/tot)*100;
  if(b){b.style.width=pct+'%';b.style.background=PS.mode==='work'?'var(--blue)':PS.mode==='short'?'var(--green)':'var(--purple)'}
  if(l)l.textContent=PS.mode==='work'?'FOCO':PS.mode==='short'?'PAUSA CURTA':'PAUSA LONGA';
  const hdrBtn=document.getElementById('pomo-hdr-btn');if(hdrBtn){hdrBtn.textContent='⏱ '+fmtT(PS.secs);hdrBtn.className='pomo-btn-hdr'+(PS.on?' running':pomoOpen?' on':'')}
}
function updatePomoCtrl(){const c=document.getElementById('pomo-ctrl-play');if(c){c.textContent=PS.on?'⏸':'▶';c.className='pomo-cbtn play'+(PS.on?' pause':'')}}
function updatePomoDots(){const c=document.getElementById('pomo-dots');if(!c)return;c.innerHTML='';for(let i=0;i<4;i++){const d=el('div','pomo-dot');if(i<PS.sess%4)d.classList.add('done');if(i===PS.sess%4&&PS.mode==='work')d.classList.add('cur');c.appendChild(d)}}
function updatePomoHist(){const c=document.getElementById('pomo-hist');if(!c)return;c.innerHTML='';if(!PS.hist.length){ap(c,ap(el('p','pomo-hist-item'),'Nenhuma sessão ainda.'));return}PS.hist.forEach(h=>ap(c,ap(el('div','pomo-hist-item'),'✓ Foco concluído às '+h)))}

  const logo=ap(el('div','',{textAlign:'center',marginBottom:'28px'}),ap(el('div','',{width:'50px',height:'50px',borderRadius:'12px',background:'var(--blue)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',color:'#fff',fontSize:'22px',fontWeight:'700'}),'D'),ap(el('h1','',{fontSize:'22px',fontWeight:'700',marginBottom:'4px'}),'DemandFlow'),ap(el('p','tc2',{fontSize:'13px'}),'Central da sua equipe'));
  const form=ap(el('div','',{display:'flex',flexDirection:'column',gap:'12px'}),ap(ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'E-mail')),emI),ap(ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Senha')),pwI),err,sb);
  ap(lc,logo,form);
  const hint=ap(el('p','',{textAlign:'center',fontSize:'12px',color:'rgba(255,255,255,.4)',marginTop:'16px'}),'Sem acesso? Solicite ao administrador.');
  ap(root,ap(el('div','login-bg'),lc,hint));
}

// ── AUTH ─────────────────────────────────────────────────────
onAuthStateChanged(auth,async fu=>{
  if(fu){const s=await getDoc(doc(db,'users',fu.uid));if(s.exists()){CU=fu;CP=s.data();subscribe();renderApp()}else renderLogin()}
  else{unsubs.forEach(u=>u());CU=CP=null;demands=notices=prospects=[];renderLogin()}
});
</script>
