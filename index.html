<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemandFlow — Gestão de Demandas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Sora', sans-serif; background: #F5F5F3; color: #1a1a18; }
      input, select, textarea, button { font-family: 'Sora', sans-serif; }
      input, select, textarea {
        border: 1px solid #D3D1C7;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
        background: #fff;
      }
      input:focus, select:focus, textarea:focus { border-color: #0F6E56; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D3D1C7; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
