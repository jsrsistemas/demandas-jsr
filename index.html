<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>JSR Sistemas — Central da Equipe</title>
<meta property="og:title" content="JSR Sistemas — Atualizações do sistema"/>
<meta property="og:description" content="Novas atualizações disponíveis. Clique para acessar o portal e conferir as novidades."/>
<meta property="og:type" content="website"/>
<meta name="description" content="Portal de atualizações do sistema JSR Sistemas — DemandFlow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --sb:#14181F;--sbt:#8B95A5;--sbab:rgba(59,98,160,.22);
  --bg:#F4F6F8;--card:#fff;--brd:#DDE3EA;
  --t1:#1C2433;--t2:#5A6678;--t3:#94A0B0;
  --blue:#1E4E79;--bluel:#EDF3F8;--blueb:#BCD2E2;
  --green:#2F7D5C;--greenl:#EDF7F2;--greenb:#B5DCC9;
  --amber:#9C6615;--amberl:#FBF5E9;--amberb:#E8D2A6;
  --red:#A93B3B;--redl:#FAEFEF;--redb:#E5BFBF;
  --purple:#5B4B8A;--purplel:#F2F0F8;--purpleb:#CFC7E3;
  --cyan:#2A7286;--cyanl:#EDF6F8;--cyanb:#B8DCE5;
  --orange:#A85B2A;--orangel:#FAF2EC;--orangeb:#E5C7AE;
  --sh:0 1px 2px rgba(28,36,51,.06),0 1px 3px rgba(28,36,51,.04);
  --sh2:0 4px 14px rgba(28,36,51,.1);
  --r:10px;--sbw:220px;--bnav:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;overflow-x:hidden}
input,select,textarea,button{font-family:'Inter',sans-serif;font-size:13px}
input,select,textarea{border:1px solid var(--brd);border-radius:8px;padding:9px 12px;outline:none;background:#fff;color:var(--t1);transition:border .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}

/* ─── LAYOUT ─────────────────────────────── */
.layout{display:flex;min-height:100vh}
.main{flex:1;margin-left:var(--sbw);display:flex;flex-direction:column;min-height:100vh}

/* ─── SIDEBAR DESKTOP ────────────────────── */
.sb{width:var(--sbw);background:var(--sb);position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:200}
.sb-logo{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo-icon{width:34px;height:34px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.sb-logo-text{color:#fff;font-weight:700;font-size:14px;line-height:1.2}
.sb-logo-sub{color:var(--sbt);font-size:10px}
.sb-nav{flex:1;padding:8px;overflow-y:auto}
.sb-sec{font-size:10px;font-weight:600;color:rgba(148,163,184,.4);text-transform:uppercase;letter-spacing:.8px;padding:10px 8px 4px}
.nav-it{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--sbt);transition:all .15s;margin-bottom:2px}
.nav-it:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-it.on{background:var(--sbab);color:#fff}
.nav-it.on .ni-ic{color:var(--blue)}
.ni-ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.ni-lb{font-size:13px;font-weight:500;flex:1}
.ni-bd{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:0 6px;border-radius:10px;min-width:18px;text-align:center;line-height:18px}
.ni-bd.blue{background:var(--blue)}
.ni-bd.green{background:var(--green)}
.sb-foot{padding:8px;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.sb-uname{color:#fff;font-size:12px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{color:var(--sbt);font-size:10px}
.sb-out{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--sbt);border:none;cursor:pointer;font-size:11px;font-family:inherit;white-space:nowrap}
.sb-out:hover{background:rgba(255,255,255,.14);color:#fff}

/* ─── BOTTOM NAV MOBILE ──────────────────── */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bnav);background:#fff;border-top:1px solid var(--brd);z-index:200;padding:0 4px}
.bnav-inner{display:flex;align-items:stretch;height:100%}
.bnav-it{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t3);border:none;background:transparent;padding:4px 2px;position:relative;transition:color .15s}
.bnav-it.on{color:var(--blue)}
.bnav-it .bn-ic{font-size:20px;line-height:1}
.bnav-it .bn-lb{font-size:9px;font-weight:500}
.bnav-bd{position:absolute;top:6px;right:calc(50% - 16px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:0 4px;border-radius:8px;min-width:14px;text-align:center;line-height:14px}
.bnav-bd.blue{background:var(--blue)}

/* ─── HEADER ─────────────────────────────── */
.hdr{background:#fff;border-bottom:1px solid var(--brd);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0;gap:12px}
.hdr-l{flex:1;overflow:hidden}
.hdr-title{font-size:15px;font-weight:700;color:var(--t1)}
.hdr-phrase{font-size:11px;color:var(--t2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-clock{text-align:right;line-height:1.2}
.hdr-time{font-size:16px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.hdr-date{font-size:10px;color:var(--t3)}
.pomo-hdr-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;background:var(--bluel);color:var(--blue);border:1px solid var(--blueb);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;white-space:nowrap;transition:all .15s}
.pomo-hdr-btn:hover,.pomo-hdr-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pomo-hdr-btn.run{background:var(--red);color:#fff;border-color:var(--redb)}

/* ─── PAGE ───────────────────────────────── */
.page{flex:1;padding:20px}

/* ─── CARDS ──────────────────────────────── */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-t{font-size:13px;font-weight:600}
.card-b{padding:18px}

/* ─── BUTTONS ────────────────────────────── */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover:not(:disabled){background:#1A4368}
.btn-s{background:transparent;color:var(--t2);border:1px solid var(--brd)}.btn-s:hover:not(:disabled){background:var(--bg)}
.btn-d{background:var(--redl);color:var(--red);border:1px solid var(--redb)}.btn-d:hover:not(:disabled){background:var(--red);color:#fff}
.btn-g{background:var(--greenl);color:var(--green);border:1px solid var(--greenb)}.btn-g:hover:not(:disabled){background:var(--green);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn-w{width:100%;justify-content:center}

/* ─── TAGS ───────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:500;white-space:nowrap;border:1px solid transparent}

/* ─── AVATAR ─────────────────────────────── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;user-select:none}

/* ─── STATS ──────────────────────────────── */
.stats-g{display:grid;gap:12px;margin-bottom:20px}
.stats-3{grid-template-columns:repeat(3,1fr)}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stat-c{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-left:3px solid}
.stat-v{font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}
.stat-l{font-size:12px;color:var(--t2)}

/* ─── DEMANDAS ───────────────────────────── */
.dem-wrap{display:flex;flex:1;min-height:calc(100vh - 56px)}
.dem-left{width:340px;flex-shrink:0;background:var(--card);border-right:1px solid var(--brd);display:flex;flex-direction:column}
.dem-right{flex:1;overflow-y:auto;background:var(--bg)}
.dem-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 10px}
.dem-sc{border-radius:9px;padding:10px 8px;text-align:center;border:1px solid transparent}
.dem-sv{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.5px}
.dem-sl{font-size:10px;font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.3px}
.dem-tabs{display:flex;gap:4px;padding:4px 14px 0}
.dem-tab{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--brd);color:var(--t2);background:#fff;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap}
.dem-tab.on{font-weight:600}
.dem-search{padding:10px 14px;display:flex;gap:8px}
.dem-list{flex:1;overflow-y:auto}
.dem-item{padding:14px 16px;border-bottom:1px solid var(--brd);cursor:pointer;transition:all .15s;border-left:3px solid transparent;margin:0}
.dem-item:hover{background:#F8FAFB;border-left-color:#CBD5E1}
.dem-item.sel{background:var(--bluel);border-left-color:var(--blue)}
.dem-item .tag{font-size:10px;padding:1px 7px}
.detail{padding:20px;max-width:760px}

/* ─── AVISOS ─────────────────────────────── */
.notices-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.notice-c{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);border-top:3px solid}
.notice-h{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:10px}
.notice-b{padding:0 16px 14px}

.updates-wrap{overflow-y:auto;overflow-x:scroll;max-height:calc(100vh - 210px);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--brd);border-bottom:none;background:var(--card);box-shadow:var(--sh);scrollbar-width:none}
.updates-wrap::-webkit-scrollbar{width:12px;height:0px}
.updates-wrap::-webkit-scrollbar-track{background:#E2E8F0}
.updates-wrap::-webkit-scrollbar-thumb{background:#64748B;border-radius:6px;border:3px solid #E2E8F0}
.updates-wrap::-webkit-scrollbar-thumb:hover{background:#334155}
.updates-wrap::-webkit-scrollbar-corner{background:#E2E8F0}
.updates-wrap table{min-width:2200px;table-layout:fixed}
.sort-th{cursor:pointer;user-select:none;transition:background .15s}
.sort-th:hover{background:#EDF3F8!important}
.sort-arrow{margin-left:4px;color:var(--t3);font-size:10px}
.sort-th.asc .sort-arrow::after{content:'↑';color:var(--blue)}
.sort-th.desc .sort-arrow::after{content:'↓';color:var(--blue)}
.sort-th.asc,.sort-th.desc{color:var(--blue)!important;background:#EDF3F8!important}
.drag-handle{cursor:grab;color:var(--t3);font-size:14px;padding:0 4px;user-select:none}
.drag-handle:hover{color:var(--t1)}
tr.dragging{opacity:.4;background:#EDF3F8!important}
tr.drag-over{border-top:2px solid var(--blue)}
.update-c{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.update-h{padding:16px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.update-media{width:100%;border:none;background:#000;display:block}
.update-media.pdf{height:500px;background:#f5f5f5}
.update-media.video{aspect-ratio:16/9;height:auto}
.update-text{padding:16px 20px;font-size:13px;color:var(--t2);line-height:1.8;white-space:pre-wrap}
.update-foot{padding:12px 20px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.viewers{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.viewer-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:2px solid #fff;margin-left:-6px;flex-shrink:0}
.viewer-av:first-child{margin-left:0}

/* ─── PROSPECTS ──────────────────────────── */
.kanban-wrap{position:relative}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;align-items:flex-start;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#CBD5E1 #F1F5F9}
.kanban::-webkit-scrollbar{height:6px}
.kanban::-webkit-scrollbar-track{background:#F1F5F9;border-radius:3px}
.kanban::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.kanban::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.kb-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;justify-content:flex-end}
.kb-nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--brd);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--t2)}
.kb-nav-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.kb-col{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);width:210px;flex-shrink:0;box-shadow:var(--sh);scroll-snap-align:start}
.kb-col-h{padding:11px 13px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:7px}
.kb-col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kb-col-title{font-size:11px;font-weight:600;flex:1;line-height:1.3}
.kb-col-cnt{font-size:10px;font-weight:700;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:9px;padding:0 5px}
.kb-cards{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:80px}
.kb-card{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:10px;cursor:pointer;transition:all .15s}
.kb-card:hover{box-shadow:var(--sh2);background:#fff}
.kb-card-name{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:2px;line-height:1.3}
.kb-card-company{font-size:11px;color:var(--t2);margin-bottom:5px}
.kb-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:4px}
.kb-empty{font-size:11px;color:var(--t3);text-align:center;padding:14px 8px}

/* ─── MODAL ──────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal-h{padding:18px 20px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-t{font-size:15px;font-weight:700}
.modal-x{background:none;border:none;cursor:pointer;font-size:22px;color:var(--t3);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg)}
.modal-b{padding:18px 20px}
.modal-f{padding:12px 20px;border-top:1px solid var(--brd);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff}
.form-g{margin-bottom:12px}
.form-l{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ─── POMODORO ───────────────────────────── */
.pomo-panel{position:fixed;right:0;top:56px;bottom:0;width:290px;background:#fff;border-left:1px solid var(--brd);z-index:150;display:none;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.1);transition:transform .25s}
.pomo-panel.on{display:flex}
.main.pomo-on{margin-right:290px}
.pomo-ph{background:var(--sb);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pomo-ph-t{color:#fff;font-size:13px;font-weight:600}
.pomo-pb{padding:16px;overflow-y:auto;flex:1}
.pomo-modes{display:flex;gap:3px;margin-bottom:14px;background:var(--bg);padding:3px;border-radius:9px}
.pomo-mbt{flex:1;padding:6px;border-radius:7px;font-size:11px;font-weight:500;border:none;cursor:pointer;font-family:inherit;color:var(--t2);background:transparent;transition:all .15s}
.pomo-mbt.on{background:#fff;color:var(--t1);font-weight:600;box-shadow:var(--sh)}
.pomo-disp{text-align:center;padding:8px 0 14px}
.pomo-timer{font-size:50px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:3px;line-height:1;margin-bottom:4px}
.pomo-timer.work{color:var(--blue)}.pomo-timer.short{color:var(--green)}.pomo-timer.long{color:var(--purple)}
.pomo-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)}
.pomo-bar{height:4px;background:var(--brd);border-radius:2px;margin-bottom:14px;overflow:hidden}
.pomo-fill{height:4px;border-radius:2px;transition:width .5s;width:0}
.pomo-ctrl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px}
.pomo-cb{width:36px;height:36px;border-radius:50%;border:1px solid var(--brd);background:var(--bg);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.pomo-cb:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.pomo-cb.play{width:50px;height:50px;font-size:20px;background:var(--blue);border-color:var(--blue);color:#fff}
.pomo-cb.play:hover{background:#1A4368}.pomo-cb.paused{background:var(--amber);border-color:var(--amber)}
.pomo-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.pomo-dot{width:8px;height:8px;border-radius:50%;background:var(--brd)}
.pomo-dot.done{background:var(--blue)}.pomo-dot.cur{background:var(--amber)}
.pomo-div{height:1px;background:var(--brd);margin-bottom:12px}
.pomo-cfg-t{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pomo-cfg-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pomo-cfg-l{font-size:12px;color:var(--t2)}
.pomo-cfg-i{width:54px;text-align:center;padding:4px 6px}
.pomo-hist{margin-top:12px;max-height:80px;overflow-y:auto}
.pomo-hist-item{font-size:11px;color:var(--t3);padding:3px 0;border-bottom:1px solid var(--brd)}

/* ─── USERS ──────────────────────────────── */
.users-wrap{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.user-row{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--brd)}
.user-row:last-child{border-bottom:none}

/* ─── LOGIN ──────────────────────────────── */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#14181F,#1E3A5F 50%,#14181F);padding:16px}
.login-card{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.3)}

/* ─── EMPTY ──────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;color:var(--t3)}
.empty-ic{font-size:38px;margin-bottom:12px}
.empty-t{font-size:14px;font-weight:500;color:var(--t2);margin-bottom:4px}
.empty-s{font-size:12px}

/* ─── UTILS ──────────────────────────────── */
.flex{display:flex}.aic{align-items:center}.jcsb{justify-content:space-between}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}

// ── BLOCOS DE ATUALIZAÇÕES ───────────────────────────────────────────────────
let updateBlocks=[] // [{id, name, color}]
const BLOCK_COLORS=['#1E4E79','#2F7D5C','#9C6615','#5B4B8A','#A93B3B','#2A7286','#A85B2A','#8E3A62']

async function loadBlocks(){
  try{const s=await getDoc(doc(db,'config','update_blocks'));if(s.exists())updateBlocks=s.data().blocks||[]}catch{}
}
async function saveBlocks(){
  await setDoc(doc(db,'config','update_blocks'),{blocks:updateBlocks,updatedAt:serverTimestamp()})
}
function openBlockManager(){
  const ov=el('div','overlay');const mo=el('div','modal',{maxWidth:'480px'})
  const mh=ap(el('div','modal-h'),ap(el('div','modal-t'),'📦 Gerenciar Blocos'))
  const x=ap(el('button','modal-x'),'×');x.onclick=()=>ov.remove();mh.appendChild(x)
  const mb=el('div','modal-b')

  function renderList(){
    mb.innerHTML=''
    if(!updateBlocks.length)ap(mb,ap(el('p','f12 tc3 mb12'),'Nenhum bloco criado ainda.'))
    updateBlocks.forEach((b,i)=>{
      const row=el('div','flex aic g8',{padding:'8px 0',borderBottom:'1px solid var(--brd)'})
      const dot=el('div','',{width:'12px',height:'12px',borderRadius:'50%',background:b.color||'var(--blue)',flexShrink:'0'})
      ap(row,dot,ap(el('span','f13 fw5',{flex:'1'}),b.name))
      const cnt=updates.filter(u=>u.blockId===b.id).length
      ap(row,ap(el('span','f11 tc3'),cnt+' item'+(cnt!==1?'s':'')))
      const del=ap(el('button','btn btn-d btn-xs'),'Remover')
      del.onclick=async()=>{updateBlocks.splice(i,1);await saveBlocks();renderList()}
      row.appendChild(del);mb.appendChild(row)
    })
    // Adicionar novo
    const addRow=el('div','flex g8 mt12',{marginTop:'16px'})
    const ni=el('input','',{flex:'1'});ni.placeholder='Nome do bloco (ex: 1º Semestre 2025)'
    let chosenColor=BLOCK_COLORS[updateBlocks.length%BLOCK_COLORS.length]
    const colorPick=el('div','flex g4')
    BLOCK_COLORS.forEach(c=>{
      const dot=el('div','',{width:'20px',height:'20px',borderRadius:'50%',background:c,cursor:'pointer',border:c===chosenColor?'3px solid #1C2433':'2px solid transparent',flexShrink:'0'})
      dot.onclick=()=>{chosenColor=c;colorPick.querySelectorAll('div').forEach(d=>d.style.border=d.style.background===c?'3px solid #1C2433':'2px solid transparent')}
      colorPick.appendChild(dot)
    })
    const addBtn=ap(el('button','btn btn-p btn-sm'),'+ Adicionar')
    addBtn.onclick=async()=>{
      if(!ni.value.trim())return
      const newBlock={id:'blk_'+Date.now(),name:ni.value.trim(),color:chosenColor}
      updateBlocks.push(newBlock);await saveBlocks();ni.value='';renderList()
    }
    ni.onkeydown=e=>{if(e.key==='Enter')addBtn.click()}
    ap(addRow,ni,addBtn);mb.appendChild(colorPick);mb.appendChild(addRow)
  }
  renderList()
  const mf=el('div','modal-f')
  const cl=ap(el('button','btn btn-s'),'Fechar');cl.onclick=()=>ov.remove()
  mf.appendChild(cl);ap(mo,mh,mb,mf);ov.appendChild(mo);document.body.appendChild(ov)
}

const APP_NAME='JSR Sistemas'
const APP_SUBTITLE='Central da Equipe'
const AVC=n=>{const i=(n?.charCodeAt(0)||0)%5;return[['#1E4E79','#D8E6F0'],['#2F7D5C','#D8EEE3'],['#5B4B8A','#E2DDF0'],['#9C6615','#F3E8CF'],['#A93B3B','#F2DCDC']][i]}

// ── UTILS ────────────────────────────────────────────────────
const ago=ts=>{if(!ts)return'...';const d=ts.toDate?ts.toDate():new Date(ts);const m=Math.floor((Date.now()-d)/60000);if(m<1)return'agora';if(m<60)return m+'min';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'}
const ini=n=>(n||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
const fmtMoney=v=>v?'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2}):''
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')
const el=(t,cls,sty)=>{const e=document.createElement(t);if(cls)e.className=cls;if(sty)Object.assign(e.style,sty);return e}
const ap=(p,...c)=>{c.forEach(x=>{if(x!=null)p.appendChild(typeof x==='string'?document.createTextNode(x):x)});return p}
const $=(s,ctx=document)=>ctx.querySelector(s)
const tag_=(cf,t)=>{const s=el('span','tag');Object.assign(s.style,{background:cf.bg,color:cf.c,borderColor:cf.bd});s.textContent=t;return s}
const av=(n,sz=32)=>{const[c,b]=AVC(n||'?');const d=el('div','av',{width:sz+'px',height:sz+'px',background:b,color:c,fontSize:(sz*.36)+'px'});d.textContent=ini(n||'?');return d}

// ── YOUTUBE EMBED ────────────────────────────────────────────
function ytId(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.searchParams.get('v'))return u.searchParams.get('v');return null}catch{return null}}
function buildMedia(type,url,content){
  if(type==='video'){
    const id=ytId(url);
    if(id){const f=el('iframe','update-media video',{height:'auto'});f.src=`https://www.youtube.com/embed/${id}`;f.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';f.allowFullscreen=true;return f}
    const f=el('iframe','update-media video',{height:'auto'});f.src=url;f.allow='autoplay';f.allowFullscreen=true;return f
  }
  if(type==='storage_video'){
    const v=el('video','update-media',{controls:'true',style:'background:#000;max-height:400px'});v.src=url;v.style.background='#000';v.style.maxHeight='400px';return v
  }
  if(type==='pdf'){const f=el('iframe','update-media pdf');f.src=url+'#toolbar=0';return f}
  if(type==='text'){const p=el('div','update-text');p.textContent=content;return p}
  return null
}

// ── CLOCK ────────────────────────────────────────────────────
let clkInt=null
function startClock(){clearInterval(clkInt);const tick=()=>{const t=$('#clk-t'),d=$('#clk-d');if(!t){clearInterval(clkInt);return}const n=new Date();t.textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});d.textContent=n.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})};tick();clkInt=setInterval(tick,1000)}

// ── BEEP ─────────────────────────────────────────────────────
const beep=(f=880,d=200,v=.3)=>{try{const ctx=new AudioContext();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d/1e3);o.start();o.stop(ctx.currentTime+d/1e3)}catch{}}
const beepDone=()=>{beep(440,150);setTimeout(()=>beep(550,150),180);setTimeout(()=>beep(660,300),360)}

// ── POMODORO ─────────────────────────────────────────────────
const pTot=()=>({work:PS.cfg.work*60,short:PS.cfg.short*60,long:PS.cfg.long*60}[PS.mode])
function pNext(){if(PS.mode==='work'){PS.sess++;PS.hist.unshift(new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));if(PS.hist.length>8)PS.hist.pop();PS.mode=PS.sess%4===0?'long':'short'}else PS.mode='work';PS.secs=pTot();PS.on=false;clearInterval(pomoInt);beepDone();pRefresh()}
function pTick(){if(PS.secs<=0){pNext();return}PS.secs--;pDisp()}
const pStart=()=>{PS.on=true;pomoInt=setInterval(pTick,1e3);beep(660,100);pCtrl()}
const pPause=()=>{PS.on=false;clearInterval(pomoInt);pCtrl()}
const pReset=()=>{pPause();PS.secs=pTot();pDisp();pCtrl()}
const pMode=m=>{pPause();PS.mode=m;PS.secs=pTot();pRefresh();document.querySelectorAll('.pomo-mbt').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
function pDisp(){const t=$('#pt');const f=$('#pf');const l=$('#pl');if(!t)return;t.textContent=fmtT(PS.secs);t.className='pomo-timer '+PS.mode;const tot=pTot();if(f){f.style.width=((tot-PS.secs)/tot*100)+'%';f.style.background=PS.mode==='work'?'var(--blue)':PS.mode==='short'?'var(--green)':'var(--purple)'}if(l)l.textContent=PS.mode==='work'?'FOCO':PS.mode==='short'?'PAUSA CURTA':'PAUSA LONGA';const hb=$('#pomo-hdr-btn');if(hb){hb.className='pomo-hdr-btn'+(pomoOpen?' on':'')+(PS.on?' run':'');hb.innerHTML='⏱ <span>'+fmtT(PS.secs)+'</span>'}}
function pCtrl(){const c=$('#pcc');if(c){c.textContent=PS.on?'⏸':'▶';c.className='pomo-cb play'+(PS.on?' paused':'')}}
function pDots(){const c=$('#pd');if(!c)return;c.innerHTML='';for(let i=0;i<4;i++){const d=el('div','pomo-dot');if(i<PS.sess%4)d.classList.add('done');if(i===PS.sess%4&&PS.mode==='work')d.classList.add('cur');c.appendChild(d)}}
function pHist(){const c=$('#ph');if(!c)return;c.innerHTML='';if(!PS.hist.length){ap(c,ap(el('p','pomo-hist-item'),'Nenhuma sessão.'));return}PS.hist.forEach(h=>ap(c,ap(el('div','pomo-hist-item'),'✓ Foco às '+h)))}
function pRefresh(){pDisp();pCtrl();pDots();pHist()}

  {id:'demands',i:'📋',l:'Demandas'},
  {id:'notices',i:'📢',l:'Avisos'},

function getBadge(id){
  if(id==='demands')return demands.filter(d=>d.status==='open').length||0
  if(id==='notices')return notices.filter(n=>!n.readBy?.includes(CU.uid)).length||0
  if(id==='updates')return updates.filter(u=>!u.viewedBy?.some(v=>v.uid===CU.uid)).length||0
  if(id==='prospects')return prospects.filter(p=>!['fechado','nao_fechado'].includes(pstN(p.status))).length||0
  return 0
}

function buildBnav(){
  const isA=CP?.role==='admin'
  const bn=el('div','bnav')

    const b=ap(el('button','bnav-it'+(sec===it.id?' on':'')),ap(el('div','bn-ic'),it.i),ap(el('div','bn-lb'),it.l))

function buildHeader(){
  const labels={demands:'Demandas',notices:'Avisos',updates:'Atualizações',prospects:'Prospects',users:'Usuários'}
  const hdr=el('div','hdr')

  function getFiltered(){
    return updates.filter(u=>{
      if(filterBlock&&u.blockId!==filterBlock)return false
      if(filterMod&&u.devMod!==filterMod)return false
      if(filterCat&&u.devCat!==filterCat)return false
      if(searchTxt){const s=((u.title||'')+(u.screenName||'')+(u.description||'')).toLowerCase();if(!s.includes(searchTxt))return false}
      return true
    })
  }
  let sortCol=null,sortDir=1
  let dragSrc=null

  function redraw(){renderRows(tbody)}

  function getSorted(){
    const base=getFiltered()
    if(!activeSortFn||activeSortKey==='manual'){
      // Ordem manual: respeita a ordem salva no Firestore
      try{
        const savedOrder=JSON.parse(localStorage.getItem('updates_order_'+CP?.uid)||'[]')
        if(savedOrder.length){
          const idxMap=Object.fromEntries(savedOrder.map((id,i)=>[id,i]))
          return[...base].sort((a,b)=>(idxMap[a.id]??9999)-(idxMap[b.id]??9999))
        }
      }catch{}
      return base
    }
    return[...base].sort(activeSortFn)
  }

  function renderRows(tb){
    if(!tb)return
    const newRows=Array.from(tb.querySelectorAll('tr[data-new]'))
    tb.innerHTML=''
    newRows.forEach(r=>tb.appendChild(r))

    const sorted=getSorted()
    if(typeof totalLbl!=='undefined')totalLbl.textContent=sorted.length+' de '+updates.length+' registro'+(updates.length!==1?'s':'')
    setTimeout(updateThumb,50)
    if(!sorted.length&&!newRows.length){
      const tr=el('tr')
      const td=ap(el('td','',{padding:'20px',textAlign:'center',color:'var(--t3)',fontSize:'13px'}),
        isA?'Clique em "+ Adicionar linha" para criar a primeira atualização.':'Nenhuma atualização publicada ainda.')
      td.setAttribute('colspan','12')
      ap(tr,td);tb.appendChild(tr);return
    }

    sorted.forEach(u=>{
      const viewed=u.viewedBy?.some(v=>v.uid===CU.uid)
      const viewCount=u.viewedBy?.length||0
      const ts=u.createdAt?.toDate?.()||new Date()
      const tr=el('tr','',{background:viewed?'var(--card)':'#FBF5E9'})
      tr.draggable=isA

      // Drag events
      if(isA){
        tr.addEventListener('dragstart',e=>{dragSrc=tr;tr.classList.add('dragging');e.dataTransfer.effectAllowed='move'})
        tr.addEventListener('dragend',()=>{tr.classList.remove('dragging');document.querySelectorAll('tr.drag-over').forEach(r=>r.classList.remove('drag-over'))})
        tr.addEventListener('dragover',e=>{e.preventDefault();if(tr!==dragSrc){document.querySelectorAll('tr.drag-over').forEach(r=>r.classList.remove('drag-over'));tr.classList.add('drag-over')}})
        tr.addEventListener('drop',e=>{
          e.preventDefault();tr.classList.remove('drag-over')
          if(dragSrc&&dragSrc!==tr){
            const rows=[...tb.querySelectorAll('tr:not([data-new])')]
            const si=rows.indexOf(dragSrc),ti=rows.indexOf(tr)
            if(si<ti)tb.insertBefore(dragSrc,tr.nextSibling)
            else tb.insertBefore(dragSrc,tr)
            // Save new order to Firestore
            const newOrder=[...tb.querySelectorAll('tr:not([data-new])')].map(r=>r.dataset.uid).filter(Boolean)
            saveOrder(newOrder)
            localStorage.setItem('updates_order_'+CP?.uid,JSON.stringify(newOrder))
          }
        })
        tr.dataset.uid=u.id
      }
      tr.onmouseenter=()=>{if(viewed)tr.style.background='#F8FAFC'};tr.onmouseleave=()=>{tr.style.background=viewed?'var(--card)':'#FBF5E9'}

      // Drag handle
      const dragTd=el('td','',{padding:'6px 4px 6px 8px',borderBottom:'1px solid var(--brd)',textAlign:'center'})
      if(isA)ap(dragTd,ap(el('span','drag-handle'),'⋮⋮'))
      else{const b=el('span','',{fontSize:'9px',color:'var(--blue)',fontWeight:'700'});if(!viewed)b.textContent='NOVO';dragTd.appendChild(b)}
      tr.appendChild(dragTd)

      // Dados
      const td=(t,extra)=>{const d=el('td','',{padding:'7px 10px',borderBottom:'1px solid var(--brd)',verticalAlign:'middle',...(extra||{})});d.textContent=t||'—';return d}
      const tagTd=(cfg)=>{const d=el('td','',{padding:'7px 10px',borderBottom:'1px solid var(--brd)',verticalAlign:'middle'});if(cfg)d.appendChild(tag_(cfg,cfg.l));else d.textContent='—';return d}

      // Bloco
      const blk=updateBlocks.find(b=>b.id===u.blockId)
      const blkTd=el('td','',{padding:'7px 10px',borderBottom:'1px solid var(--brd)',verticalAlign:'middle'})
      if(blk){const s=ap(el('span','tag',{background:blk.color+'22',color:blk.color,borderColor:blk.color+'55',fontWeight:'600',fontSize:'10px',whiteSpace:'nowrap'}),blk.name);blkTd.appendChild(s)}
      else if(isA){const s=ap(el('select','',{fontSize:'10px',padding:'3px 5px',border:'1px solid var(--brd)',borderRadius:'5px',background:'transparent',cursor:'pointer'}));s.innerHTML='<option value="">Sem bloco</option>'+updateBlocks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');s.value=u.blockId||'';s.onchange=async e=>{await updateDoc(doc(db,'updates',u.id),{blockId:e.target.value})};blkTd.appendChild(s)}
      else blkTd.textContent='—'
      tr.appendChild(blkTd)

      ap(tr,
        Object.assign(el('td','',{padding:'7px 10px',borderBottom:'1px solid var(--brd)',fontWeight:'500',maxWidth:'200px'}),{textContent:u.title||''}),
        tagTd(u.procTipo&&PROC_TIPO[u.procTipo]?PROC_TIPO[u.procTipo]:null),
        td(u.screenName,{maxWidth:'120px'}),
        td(u.version,{textAlign:'center',fontFamily:'monospace',fontSize:'11px'}),
        tagTd(u.devCat&&DEV_CAT[u.devCat]?DEV_CAT[u.devCat]:null),
        tagTd(u.devMod&&DEV_MOD[u.devMod]?DEV_MOD[u.devMod]:null),
        td(u.description,{maxWidth:'160px',color:'var(--t2)',fontSize:'11px'})
      )

      // Material
      const matTd=el('td','',{padding:'7px 6px',borderBottom:'1px solid var(--brd)',textAlign:'center',fontSize:'14px'})
      if(u.type==='storage_video'||u.type==='video')matTd.textContent='📹'
      else if(u.type==='pdf')matTd.textContent='📄'
      else if(u.imageUrl)matTd.textContent='🖼'
      else matTd.textContent='—'
      tr.appendChild(matTd)

      // Publicado
      const pubTd=el('td','',{padding:'7px 10px',borderBottom:'1px solid var(--brd)'})
      ap(pubTd,ap(el('div','fw5',{fontSize:'11px',color:'var(--t1)'}),u.createdByName||''),
        ap(el('div','',{fontSize:'10px',color:'var(--t3)'}),ts.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})),
        ap(el('div','',{fontSize:'10px',color:'var(--blue)',fontWeight:'600'}),ts.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})))
      tr.appendChild(pubTd)

      // Visto
      const viTd=el('td','',{padding:'7px 8px',borderBottom:'1px solid var(--brd)',textAlign:'center'})
      if(!viewed){const cb=ap(el('button','btn btn-g btn-xs'),'✓ Vi');cb.onclick=async()=>{cb.disabled=true;await updateDoc(doc(db,'updates',u.id),{viewedBy:arrayUnion({uid:CU.uid,name:CP.name,viewedAt:new Date().toISOString()})})};viTd.appendChild(cb)}
      else ap(viTd,ap(el('div','',{fontSize:'10px',color:'var(--green)',fontWeight:'600'}),'✓ Visto'))
      ap(viTd,ap(el('div','',{fontSize:'10px',color:'var(--t3)',marginTop:'2px'}),viewCount+(viewCount===1?' pessoa':' pessoas')))
      tr.appendChild(viTd)

      // Ações
      if(isA){
        const actTd=el('td','',{padding:'6px 8px',borderBottom:'1px solid var(--brd)'})
        const editBtn=ap(el('button','btn btn-s btn-xs'),'✏');editBtn.onclick=()=>openUpdateModal(u)
        const delBtn=ap(el('button','btn btn-d btn-xs'),'×');delBtn.onclick=async()=>{if(confirm('Excluir?'))await deleteDoc(doc(db,'updates',u.id))}
        ap(actTd,ap(el('div','flex g4'),editBtn,delBtn));tr.appendChild(actTd)
      }
      tbody.appendChild(tr)
    })
  }

  }

  function addInlineRow(){
    const tb=tbody
    const existing=tb.querySelector('tr[data-new]')
    if(existing){existing.querySelector('input')?.focus();existing.scrollIntoView({behavior:'smooth',block:'center'});return}

    let nf={title:'',procTipo:'',screenName:'',version:'',devCat:'',devMod:'',description:''}
    const tr=el('tr','',{background:'#EDF3F8'});tr.setAttribute('data-new','1')

    const mkInp=(ph,key,w)=>{const td=el('td','',{padding:'5px 6px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8'});const inp=el('input','',{fontSize:'12px',padding:'6px 8px',border:'1px solid var(--blueb)',borderRadius:'6px',width:w||'100%',background:'#fff'});inp.placeholder=ph;inp.oninput=e=>nf[key]=e.target.value;td.appendChild(inp);return td}
    const mkSel=(opts,key)=>{const td=el('td','',{padding:'5px 6px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8'});const sel=el('select','',{fontSize:'11px',padding:'5px 6px',border:'1px solid var(--blueb)',borderRadius:'6px',width:'100%',background:'#fff'});sel.innerHTML='<option value="">—</option>'+Object.entries(opts).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('');sel.onchange=e=>nf[key]=e.target.value;td.appendChild(sel);return td}

    const handleTd=el('td','',{padding:'5px 6px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8',textAlign:'center',color:'var(--blue)',fontSize:'12px'});handleTd.textContent='+';tr.appendChild(handleTd)

    const titleTd=mkInp('Título *','title','180px');titleTd.querySelector('input').style.fontWeight='500'
    ap(tr,titleTd,mkSel(PROC_TIPO,'procTipo'),mkInp('Tela','screenName'),mkInp('v1.0','version','55px'),mkSel(DEV_CAT,'devCat'),mkSel(DEV_MOD,'devMod'))

    const descTd=el('td','',{padding:'5px 6px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8'});const descInp=el('input','',{fontSize:'11px',padding:'6px 8px',border:'1px solid var(--blueb)',borderRadius:'6px',width:'100%',background:'#fff'});descInp.placeholder='Descrição...';descInp.oninput=e=>nf.description=e.target.value;descTd.appendChild(descInp);tr.appendChild(descTd)

    ;[
      el('td','',{padding:'5px 6px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8',textAlign:'center',color:'var(--t3)',fontSize:'10px',textContent:'—'}),
      el('td','',{padding:'5px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8'}),
      el('td','',{padding:'5px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8'}),
    ].forEach(t=>tr.appendChild(t))

    const actTd=el('td','',{padding:'5px 8px',borderBottom:'2px solid var(--blue)',background:'#EDF3F8'})
    const saveBtn=ap(el('button','btn btn-p btn-xs'),'Salvar')
    const cancelBtn=ap(el('button','btn btn-s btn-xs'),'×')
    saveBtn.onclick=async()=>{
      if(!nf.title.trim()){titleTd.querySelector('input').style.borderColor='var(--red)';titleTd.querySelector('input').focus();return}
      saveBtn.disabled=true;saveBtn.textContent='...'
      try{
        const ref=await addDoc(collection(db,'updates'),{...nf,type:'none',url:'',imageUrl:'',createdBy:CU.uid,createdByName:CP.name,createdAt:serverTimestamp(),viewedBy:[{uid:CU.uid,name:CP.name,viewedAt:new Date().toISOString()}]})
        tr.remove()
        // onSnapshot vai atualizar a tabela automaticamente
      }catch(e){alert('Erro ao salvar: '+e.message);saveBtn.disabled=false;saveBtn.textContent='Salvar'}
    }
    cancelBtn.onclick=()=>tr.remove()
    ap(actTd,ap(el('div','flex g4'),saveBtn,cancelBtn));tr.appendChild(actTd)

    if(tbody.firstChild)tbody.insertBefore(tr,tbody.firstChild)
    else tbody.appendChild(tr)
    tblWrap.scrollTop=0
    titleTd.querySelector('input').focus()
  }

  renderRows(tbody)
  return w
}

function printUpdates(){
  const ov=el('div','overlay')
  const mo=el('div','modal',{maxWidth:'500px'})
  const mh=ap(el('div','modal-h'),ap(el('div','modal-t'),'🖨️ Selecionar colunas para imprimir'))
  const x=ap(el('button','modal-x'),'×');x.onclick=()=>ov.remove();mh.appendChild(x)
  const mb=el('div','modal-b')
  ap(mb,ap(el('p','f12 tc2 mb12'),'Marque as colunas que deseja incluir na impressão:'))

  const COLS=[
    {key:'idx',l:'#',checked:true},
    {key:'title',l:'Título',checked:true},
    {key:'procTipo',l:'Tipo de Processo',checked:true},
    {key:'screenName',l:'Nome da Tela',checked:true},
    {key:'version',l:'Versão',checked:true},
    {key:'devCat',l:'Tipo de Desenvolvimento',checked:true},
    {key:'devMod',l:'Módulo',checked:true},
    {key:'description',l:'Descrição',checked:true},
    {key:'block',l:'Bloco',checked:true},
    {key:'material',l:'Material',checked:false},
    {key:'published',l:'Publicado por / Data',checked:true},
  ]
  const state={}
  COLS.forEach(c=>state[c.key]=c.checked)

  const grid=el('div','',{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'})
  COLS.forEach(c=>{
    const row=el('div','flex aic g8',{padding:'6px 10px',border:'1px solid var(--brd)',borderRadius:'8px',cursor:'pointer'})
    const cb=el('input','');cb.type='checkbox';cb.checked=c.checked;cb.style.cssText='width:auto;flex-shrink:0'
    const lbl=ap(el('label','f12 fw5',{cursor:'pointer'}),c.l)
    cb.onchange=e=>state[c.key]=e.target.checked
    row.onclick=()=>{cb.checked=!cb.checked;state[c.key]=cb.checked}
    ap(row,cb,lbl);grid.appendChild(row)
  })
  mb.appendChild(grid)

  const mf=el('div','modal-f')
  const can=ap(el('button','btn btn-s'),'Cancelar');can.onclick=()=>ov.remove()
  const gen=ap(el('button','btn btn-p'),'Gerar impressão')
  gen.onclick=()=>{ov.remove()
    // Captura ordem visual atual da tabela
    const visOrder=Array.from(document.querySelectorAll('#updates-tbody tr[data-uid]')).map(r=>r.dataset.uid)
    const orderedUpdates=visOrder.length
      ?visOrder.map(id=>updates.find(u=>u.id===id)).filter(Boolean)
      :updates
    doprint(cols,orderedUpdates)
  }
  ap(mf,can,gen);ap(mo,mh,mb,mf);ov.appendChild(mo);document.body.appendChild(ov)

  function doprint(cols,orderedUpdates){
    const data=orderedUpdates||updates
    const now=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})
    const headers=COLS.filter(c=>cols[c.key]).map(c=>`<th>${c.l}</th>`).join('')
    const rows=data.map((u,i)=>{
      const tds=COLS.filter(c=>cols[c.key]).map(c=>{
        if(c.key==='idx')return `<td style="text-align:center;color:#64748B">${i+1}</td>`
        if(c.key==='title')return `<td style="font-weight:600">${u.title||''}</td>`
        if(c.key==='procTipo')return `<td>${u.procTipo&&PROC_TIPO[u.procTipo]?PROC_TIPO[u.procTipo].l:''}</td>`
        if(c.key==='screenName')return `<td>${u.screenName||''}</td>`
        if(c.key==='version')return `<td style="text-align:center;font-family:monospace">${u.version||''}</td>`
        if(c.key==='devCat')return `<td>${u.devCat&&DEV_CAT[u.devCat]?DEV_CAT[u.devCat].l:''}</td>`
        if(c.key==='devMod')return `<td>${u.devMod&&DEV_MOD[u.devMod]?DEV_MOD[u.devMod].l:''}</td>`
        if(c.key==='description')return `<td style="color:#64748B">${u.description||''}</td>`
        if(c.key==='block'){const b=updateBlocks.find(bl=>bl.id===u.blockId);return `<td>${b?b.name:''}</td>`}
        if(c.key==='material'){const m=u.type==='storage_video'||u.type==='video'?'Vídeo':u.type==='pdf'?'PDF':u.imageUrl?'Imagem':'—';return `<td style="text-align:center">${m}</td>`}
        if(c.key==='published'){const ts=u.createdAt?.toDate?.()||new Date();return `<td>${u.createdByName||''}<br><span style="color:#64748B;font-size:9px">${ts.toLocaleDateString('pt-BR')}</span></td>`}
        return '<td></td>'
      }).join('')
      return `<tr style="background:${i%2===0?'#fff':'#F8FAFC'}">${tds}</tr>`
    }).join('')
    const pw=window.open('','_blank')
    if(!pw){alert('Permita pop-ups.');return}
    pw.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><title>Atualizações JSR</title>
    <style>@page{size:A4 landscape;margin:1cm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:10px;color:#1C2433}h1{font-size:14px;font-weight:700;margin-bottom:3px}.sub{font-size:9px;color:#64748B;margin-bottom:10px}table{width:100%;border-collapse:collapse}th{background:#1C2433;color:#fff;padding:6px 8px;text-align:left;font-size:9px;text-transform:uppercase}td{padding:5px 8px;border-bottom:1px solid #E2E8F0;vertical-align:top;font-size:10px}.footer{margin-top:10px;font-size:9px;color:#94A3B8;text-align:right}</style>
    </head><body><h1>Atualizações do Sistema — JSR Sistemas</h1><div class="sub">Gerado em ${now} · ${updates.length} registro${updates.length!==1?'s':''}</div>
    <table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>
    <div class="footer">DemandFlow · JSR Sistemas · ${now}</div>
    <script>window.onload=()=>window.print()<\/script></body></html>`)
    pw.document.close()
  }
}

function exportUpdateTemplate(){
  if(!window.XLSX){alert('Aguarde o carregamento da biblioteca Excel.');return}
  const XLSX=window.XLSX
  const wb=XLSX.utils.book_new()

  // Aba principal com cabeçalhos e exemplo
  const headers=['Título*','Tipo de Processo','Nome da Tela','Versão','Tipo de Desenvolvimento','Módulo','Descrição']
  const example=['Manutenção de custo via planilha Excel','Comercial','Pedido de compra','2.4.1','Implementações','Módulo de custo','Importação de planilha Excel para manutenção em lote.']
  const data=[headers,example,...Array(10).fill(headers.map(()=>''))]
  const ws=XLSX.utils.aoa_to_sheet(data)

  // Largura das colunas
  ws['!cols']=[{wch:40},{wch:20},{wch:25},{wch:12},{wch:28},{wch:22},{wch:50}]

  // Aba de opções válidas
  const optsData=[
    ['Campo','Opções válidas'],
    ['Tipo de Processo',...Object.values(PROC_TIPO).map(v=>v.l)],
    ['Tipo de Desenvolvimento',...Object.values(DEV_CAT).map(v=>v.l)],
    ['Módulo',...Object.values(DEV_MOD).map(v=>v.l)],
  ]
  // Transpor para colunas separadas
  const maxLen=Math.max(...optsData.map(r=>r.length))
  const opts=optsData.map(r=>[...r,...Array(maxLen-r.length).fill('')])
  const ws2=XLSX.utils.aoa_to_sheet(opts)
  ws2['!cols']=[{wch:25},...Array(10).fill({wch:22})]

  XLSX.utils.book_append_sheet(wb,ws,'Atualizações')
  XLSX.utils.book_append_sheet(wb,ws2,'Opções válidas')
  XLSX.writeFile(wb,'modelo_atualizacoes_jsr.xlsx')
}

function importUpdateFile(file){
  if(!window.XLSX){alert('Aguarde o carregamento da biblioteca Excel.');return}
  const XLSX=window.XLSX
  const reader=new FileReader()
  reader.onload=async e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'})
      const ws=wb.Sheets[wb.SheetNames[0]]
      const rows=XLSX.utils.sheet_to_json(ws,{header:0,defval:''})

      // Mapear nomes de colunas para chaves internas
      const mapProc=Object.fromEntries(Object.entries(PROC_TIPO).map(([k,v])=>[v.l.toLowerCase(),k]))
      const mapCat=Object.fromEntries(Object.entries(DEV_CAT).map(([k,v])=>[v.l.toLowerCase(),k]))
      const mapMod=Object.fromEntries(Object.entries(DEV_MOD).map(([k,v])=>[v.l.toLowerCase(),k]))

      const str=v=>String(v??'').trim()
      const parsed=rows.map(r=>({
        title:str(r['Título*']||r['Título']),
        procTipo:mapProc[str(r['Tipo de Processo']).toLowerCase()]||'',
        screenName:str(r['Nome da Tela']),
        version:str(r['Versão']),
        devCat:mapCat[str(r['Tipo de Desenvolvimento']).toLowerCase()]||'',
        devMod:mapMod[str(r['Módulo']).toLowerCase()]||'',
        description:str(r['Descrição']),
      })).filter(r=>r.title)

      if(!parsed.length){alert('Nenhuma linha com título encontrada na planilha.');return}

      // Modal de preview
      const ov=el('div','overlay')
      const mo=el('div','modal',{maxWidth:'700px'})
      const mh=ap(el('div','modal-h'),ap(el('div','modal-t'),'📤 Importar '+parsed.length+' atualização'+(parsed.length!==1?'s':'')))
      const x=ap(el('button','modal-x'),'×');x.onclick=()=>ov.remove();mh.appendChild(x)

      const mb=el('div','modal-b')
      ap(mb,ap(el('p','f12 tc2 mb12'),'Revise os dados antes de importar. Serão criadas '+parsed.length+' atualização'+(parsed.length!==1?'s':'')+'no sistema.'))

      const tbl=el('table','',{width:'100%',borderCollapse:'collapse',fontSize:'11px'})
      const thead=el('thead')
      const hr=el('tr')
      ;['Título','Processo','Tela','Versão','Tipo Dev','Módulo'].forEach(h2=>{ap(hr,ap(el('th','',{background:'#1C2433',color:'#fff',padding:'6px 8px',textAlign:'left',fontWeight:'600'}),h2))})
      thead.appendChild(hr);tbl.appendChild(thead)
      const tbody=el('tbody')
      parsed.forEach((r,i)=>{
        const tr=el('tr','',{background:i%2===0?'#fff':'#F8FAFC'})
        const td=t=>ap(el('td','',{padding:'5px 8px',borderBottom:'1px solid #E2E8F0',fontSize:'11px'}),t||'—')
        const pt=r.procTipo?PROC_TIPO[r.procTipo]?.l||r.procTipo:''
        const dc=r.devCat?DEV_CAT[r.devCat]?.l||r.devCat:''
        const dm=r.devMod?DEV_MOD[r.devMod]?.l||r.devMod:''
        ap(tr,td(r.title),td(pt),td(r.screenName),td(r.version),td(dc),td(dm))
        tbody.appendChild(tr)
      })
      tbl.appendChild(tbody);mb.appendChild(tbl)

      const mf=el('div','modal-f')
      const can=ap(el('button','btn btn-s'),'Cancelar');can.onclick=()=>ov.remove()
      const imp=ap(el('button','btn btn-p'),'✓ Importar tudo')
      imp.onclick=async()=>{
        imp.disabled=true;imp.textContent='Importando...'
        let ok=0;let err=0
        for(const r of parsed){
          try{
            await addDoc(collection(db,'updates'),{
              ...r,type:'none',url:'',imageUrl:'',
              createdBy:CU.uid,createdByName:CP.name,
              createdAt:serverTimestamp(),
              viewedBy:[{uid:CU.uid,name:CP.name,viewedAt:new Date().toISOString()}]
            });ok++
          }catch{err++}
        }
        ov.remove()
        alert('✓ '+ok+' atualização'+(ok!==1?'s':'')+' importada'+(ok!==1?'s':'')+' com sucesso!'+(err?' ('+err+' erro'+(err!==1?'s':'')+')':''))
      }
      ap(mf,can,imp);ap(mo,mh,mb,mf);ov.appendChild(mo);document.body.appendChild(ov)
    }catch(e){alert('Erro ao ler planilha: '+e.message)}
  }
  reader.readAsArrayBuffer(file)
}

  const progTxt=ap(el('p','f11 tc2'),'Enviando...')
  progBar.appendChild(progFill);ap(progWrap,progBar,progTxt)
  vidInput.onchange=e=>{selectedVideo=e.target.files[0];if(selectedVideo){vidName.textContent='✓ '+selectedVideo.name+' ('+Math.round(selectedVideo.size/1024/1024*10)/10+' MB)';vidName.style.color='var(--green)'}}
  ap(uploadg,vidInput,vidName,progWrap)

  matSel.onchange=()=>{f.type=matSel.value;pdfg.style.display=f.type==='pdf'?'':'none';uploadg.style.display=f.type==='upload'?'':'none'}

  // Imagem / Print (opcional)
  const imgg=ap(el('div','form-g'),ap(el('label','form-l'),'Imagem / Print de tela (opcional)'))
  const imgInput=el('input','');imgInput.type='file';imgInput.accept='image/*'
  imgInput.style.cssText='padding:8px;background:#F1F5F9;border:2px dashed #CBD5E1;border-radius:8px;cursor:pointer;width:100%'
  const imgName=ap(el('p','f12 tc3',{marginTop:'5px'}),'Nenhuma imagem selecionada')
  const imgPreview=el('img','',{maxWidth:'100%',borderRadius:'8px',marginTop:'8px',display:'none'})
  imgInput.onchange=e=>{
    selectedImage=e.target.files[0]
    if(selectedImage){
      imgName.textContent='✓ '+selectedImage.name;imgName.style.color='var(--green)'
      const reader=new FileReader()
      reader.onload=ev=>{imgPreview.src=ev.target.result;imgPreview.style.display='block'}
      reader.readAsDataURL(selectedImage)
    }

  cr.onclick=async()=>{
    if(!f.title.trim())return
    cr.disabled=true;cr.textContent='Salvando...'
    try{
      let finalUrl=f.url||''
      let finalType=f.type
      let imageUrl=ex?.imageUrl||''

      // Upload vídeo
      if(f.type==='upload'&&selectedVideo){
        finalType='storage_video'
        progWrap.style.display=''
        const vRef=ref(storage,'updates/'+Date.now()+'_'+selectedVideo.name)
        const vTask=uploadBytesResumable(vRef,selectedVideo)
        await new Promise((res,rej)=>{vTask.on('state_changed',s=>{const p=Math.round(s.bytesTransferred/s.totalBytes*100);progFill.style.width=p+'%';progTxt.textContent='Enviando vídeo... '+p+'%'},rej,async()=>{finalUrl=await getDownloadURL(vTask.snapshot.ref);res()})})
        progTxt.textContent='✓ Vídeo enviado!'
      }

      // Upload imagem
      if(selectedImage){
        const iRef=ref(storage,'updates/img_'+Date.now()+'_'+selectedImage.name)
        const iTask=uploadBytesResumable(iRef,selectedImage)
        await new Promise((res,rej)=>{iTask.on('state_changed',()=>{},rej,async()=>{imageUrl=await getDownloadURL(iTask.snapshot.ref);res()})})
      }

      const data={
        title:f.title,procTipo:f.procTipo||'',screenName:f.screenName||'',
        version:f.version||'',type:finalType,url:finalUrl,imageUrl:imageUrl,
        description:f.description||'',devCat:f.devCat||'',devMod:f.devMod||'',
      }
      if(ex){
        await updateDoc(doc(db,'updates',ex.id),{...data,updatedAt:serverTimestamp()})
      } else {
        await addDoc(collection(db,'updates'),{...data,
          createdBy:CU.uid,createdByName:CP.name,
          createdAt:serverTimestamp(),
          viewedBy:[{uid:CU.uid,name:CP.name,viewedAt:new Date().toISOString()}]
        })
      }
      ov.remove()
    }catch(e){
      alert('Erro ao publicar: '+e.message)
      cr.disabled=false;cr.textContent='Publicar'
    }
  }
  ap(mf,can,cr);ap(mo,mh,mb,mf);ov.appendChild(mo);document.body.appendChild(ov)
}

function generateReport(sortBy,filterStatus){

  }
  // 2. Ordenar
  const pstOrder=Object.keys(PST)
  if(sortBy==='status')data.sort((a,b)=>pstOrder.indexOf(pstN(a.status))-pstOrder.indexOf(pstN(b.status)))
  else if(sortBy==='name')data.sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt-BR'))
  else if(sortBy==='company')data.sort((a,b)=>(a.companyName||a.name||'').localeCompare(b.companyName||b.name||'','pt-BR'))
  else if(sortBy==='value')data.sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0))

  // Consent LGPD
  const consentDiv=el('div','',{background:'#F8FAFC',border:'1px solid var(--brd)',borderRadius:'8px',padding:'10px 12px'})
  const consentRow=el('div','flex g8',{alignItems:'flex-start'})
  const cb=el('input','');cb.type='checkbox';cb.style.cssText='width:auto;margin-top:2px;flex-shrink:0'
  cb.onchange=e=>consent=e.target.checked
  const consentTxt=ap(el('label','',{fontSize:'11px',color:'var(--t2)',lineHeight:'1.6',cursor:'pointer'}),
    'Concordo com o uso dos meus dados (e-mail e telefone) pela JSR Sistemas exclusivamente para acesso a este portal de atualizações, conforme a ',
    ap(el('strong',''),'Lei Geral de Proteção de Dados (LGPD)'),
    '. Os dados não serão compartilhados com terceiros. ',
    ap(el('span','',{color:'var(--blue)',cursor:'pointer',textDecoration:'underline',onclick:()=>alert('Para solicitar exclusão dos seus dados, entre em contato: contato@jsrsistemas.com.br')}), 'Solicitar exclusão dos dados.')
  )

  const errEl=ap(el('p','',{fontSize:'12px',color:'var(--red)',display:'none'}),'')
  const btn=ap(el('button','btn btn-p btn-w',{padding:'11px',fontSize:'14px'}),'Acessar atualizações')

  btn.onclick=async()=>{
    if(!email.trim()||!email.includes('@')){errEl.textContent='Digite um e-mail válido.';errEl.style.display='block';return}
    if(!consent){errEl.textContent='Aceite os termos de uso dos dados para continuar.';errEl.style.display='block';return}
    btn.disabled=true;btn.textContent='Acessando...'
    try{
      // Acessa diretamente (regras do Firestore permitem leitura pública de updates)
      // Busca ou cria registro do cliente
      const emailHash=btoa(email.toLowerCase().trim()).replace(/=/g,'')
      const clientRef=doc(db,'clientPortal',emailHash)
      const existing=await getDoc(clientRef)
      const now=new Date().toISOString()
      if(existing.exists()){
        await updateDoc(clientRef,{lastAccess:now,accessCount:(existing.data().accessCount||0)+1,phone:phone||existing.data().phone||''})
      } else {
        await setDoc(clientRef,{email:email.toLowerCase().trim(),phone:phone||'',consentDate:now,lastAccess:now,accessCount:1,createdAt:serverTimestamp()})
      }
      // Log de acesso
      await addDoc(collection(db,'clientAccessLogs'),{clientId:emailHash,email:email.toLowerCase().trim(),accessAt:serverTimestamp(),userAgent:navigator.userAgent.substring(0,120)})

      showPortalUpdates(clientData)

      errEl.textContent='Erro: '+e.message;errEl.style.display='block'
      btn.disabled=false;btn.textContent='Acessar atualizações'

      const main=el('div','',{flex:'1',minWidth:'0'})
      ap(main,ap(el('div','fw6 f13 mb4'),c.companyName||c.contactName||'Sem nome'))
      const meta=el('div','flex g12',{flexWrap:'wrap'})
      if(c.contactName)ap(meta,ap(el('span','f11 tc2'),'👤 '+c.contactName))
      if(c.email)ap(meta,ap(el('span','f11 tc2'),'✉ '+c.email))
      if(c.phone)ap(meta,ap(el('span','f11 tc2'),'📱 '+c.phone))
      main.appendChild(meta)
      if(c.notes)ap(main,ap(el('p','f11 tc3',{marginTop:'4px',lineHeight:'1.5'}),c.notes))

      acts.appendChild(editBtn)

      row.onclick=()=>openClientModal(c)
      ap(row,avt,main,acts);body.appendChild(row)
    })
    card.appendChild(body);listWrap.appendChild(card)
  }
  render()

function buildTrainings(){
  const isA=CP?.role==='admin'
  const w=el('div','page')

  const h=el('div','flex aic jcsb mb16')
  ap(h,ap(el('h2','',{fontSize:'16px',fontWeight:'700'}),'Controle de Treinamentos'))
  const headerBtns=el('div','flex g8')
  const reportBtn=ap(el('button','btn btn-s btn-sm'),'📊 Relatório');reportBtn.onclick=()=>openTrainingReport()
  const nb=ap(el('button','btn btn-p btn-sm'),'+ Novo treinamento');nb.onclick=()=>openTrainingModal()
  ap(headerBtns,reportBtn,nb)
  h.appendChild(headerBtns)
  w.appendChild(h)

  // Stats
  const sg=el('div','stats-g stats-4 mb16')
  ;[
    {v:trainings.filter(t=>t.status==='solicitado').length,l:'Solicitados',c:'#1E4E79'},
    {v:trainings.filter(t=>t.status==='agendado').length,l:'Agendados',c:'#9C6615'},
    {v:trainings.filter(t=>t.status==='andamento').length,l:'Em andamento',c:'#2A7286'},
    {v:trainings.filter(t=>t.status==='concluido').length,l:'Concluídos',c:'#2F7D5C'},
  ].forEach(s=>{
    ap(sg,ap(el('div','stat-c',{borderLeftColor:s.c}),ap(el('div','stat-v',{color:s.c}),String(s.v)),ap(el('div','stat-l'),s.l)))
  })
  w.appendChild(sg)

  // Painel resumo por colaborador
  if(isA&&trainings.length){
    const byUser={}
    trainings.forEach(t=>{
      if(!t.responsavelName)return
      if(!byUser[t.responsavelName])byUser[t.responsavelName]={total:0,concluidos:0,minutos:0}
      byUser[t.responsavelName].total++
      if(t.status==='concluido')byUser[t.responsavelName].concluidos++
      byUser[t.responsavelName].minutos+=Number(t.duracaoMin)||0
    })
    const users2=Object.entries(byUser)
    if(users2.length){
      const rc=el('div','card mb16')
      ap(rc.appendChild(el('div','card-h')),ap(el('div','card-t'),'📊 Resumo por colaborador'))
      const rb=el('div','card-b',{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'10px'})
      users2.forEach(([name,d])=>{
        const hrs=Math.floor(d.minutos/60),mins=d.minutos%60
        const card=el('div','',{background:'#F8FAFB',borderRadius:'9px',padding:'12px 14px',border:'1px solid var(--brd)'})
        ap(card,
          ap(el('div','flex aic g8 mb8'),av(name,28),ap(el('div','fw6 f13'),name)),
          ap(el('div','f12 tc2'),'📚 '+d.total+' treinamento'+(d.total!==1?'s':'')),
          ap(el('div','f12 tc2'),'✓ '+d.concluidos+' concluído'+(d.concluidos!==1?'s':'')),
          ap(el('div','f12 tc2'),'⏱ '+(hrs>0?hrs+'h ':'')+mins+'min total')
        )
        rb.appendChild(card)
      })
      rc.appendChild(rb);w.appendChild(rc)
    }
  }

  // Lista de treinamentos
  if(!trainings.length){
    ap(w,ap(el('div','empty'),ap(el('div','empty-ic'),'🎯'),ap(el('div','empty-t'),'Nenhum treinamento'),ap(el('div','empty-s'),'Clique em "+ Novo treinamento" para começar.')))
    return w
  }

  const listCard=el('div','card')
  ap(listCard.appendChild(el('div','card-h')),ap(el('div','card-t'),'Treinamentos registrados ('+trainings.length+')'))
  const lb=el('div','')

  // Ordenar: mais recentes primeiro
  const sorted=[...trainings].sort((a,b)=>{const ta=a.createdAt?.toDate?.()?.getTime()||0;const tb=b.createdAt?.toDate?.()?.getTime()||0;return tb-ta})

  sorted.forEach(t=>{
    const st=TRAIN_ST[t.status]||TRAIN_ST.solicitado
    const row=el('div','',{padding:'14px 18px',borderBottom:'1px solid var(--brd)',display:'flex',gap:'14px',alignItems:'flex-start',cursor:'pointer',transition:'background .15s'})
    row.onmouseenter=()=>row.style.background='#F8FAFB';row.onmouseleave=()=>row.style.background='transparent'

    // Faixa de status
    const statusBar=el('div','',{width:'4px',alignSelf:'stretch',borderRadius:'3px',background:st.c,flexShrink:'0'})

    // Conteúdo principal
    const main=el('div','',{flex:'1',minWidth:'0'})
    const topRow=el('div','flex aic g8 mb4',{flexWrap:'wrap'})
    ap(topRow,tag_(st,st.l))
    if(t.clienteName)ap(topRow,ap(el('span','f12 fw6',{color:'var(--t1)'}),'👤 '+t.clienteName))
    main.appendChild(topRow)
    ap(main,ap(el('div','fw6 f13 mb4'),t.assunto||'Sem assunto'))
    const metaRow=el('div','flex g12',{flexWrap:'wrap'})
    if(t.responsavelName)ap(metaRow,ap(el('span','f11 tc2'),'🧑‍🏫 '+t.responsavelName))
    if(t.dataAgendada)ap(metaRow,ap(el('span','f11 tc2'),'📅 '+new Date(t.dataAgendada+'T00:00').toLocaleDateString('pt-BR')))
    if(t.duracaoMin)ap(metaRow,ap(el('span','f11 tc2'),'⏱ '+t.duracaoMin+'min'))
    main.appendChild(metaRow)
    if(t.observacoes)ap(main,ap(el('p','f11 tc3',{marginTop:'5px',lineHeight:'1.5'}),t.observacoes))

    // Ações
    const acts=el('div','flex g6',{flexShrink:'0',flexWrap:'wrap',justifyContent:'flex-end'})
    // Link de assinatura
    if(t.signedAt){
      ap(acts,ap(el('span','tag',{background:'#EDF7F2',color:'#2F7D5C',borderColor:'#B5DCC9',fontSize:'10px'}),'✓ Assinado'))
    } else if(t.status==='concluido'||t.status==='andamento'||t.status==='agendado'){
      const signBtn=ap(el('button','btn btn-s btn-xs',{whiteSpace:'nowrap',background:'#EDF7F2',borderColor:'#B5DCC9',color:'#2F7D5C'}),'🔗 Enviar p/ assinar')
      signBtn.onclick=async e=>{
        e.stopPropagation()
        const url=window.location.origin+window.location.pathname+'?sign-training='+t.id
        const msg='Olá! Para confirmar o treinamento realizado, acesse o link abaixo e assine:\n\n📚 '+(t.assunto||'Treinamento')+'\n🧑‍🏫 '+(t.responsavelName||'')+'\n\n🔗 '+url
        try{await navigator.clipboard.writeText(msg);alert('✓ Link copiado!\n\nCole no WhatsApp ou e-mail do cliente.')}
        catch{prompt('Copie o link:',msg)}
      }
      acts.appendChild(signBtn)
    }
    const editBtn=ap(el('button','btn btn-s btn-xs'),'✏ Editar');editBtn.onclick=e=>{e.stopPropagation();openTrainingModal(t)}
    acts.appendChild(editBtn)
    if(isA){const delBtn=ap(el('button','btn btn-d btn-xs'),'×');delBtn.onclick=async e=>{e.stopPropagation();if(confirm('Excluir treinamento?'))await deleteDoc(doc(db,'trainings',t.id))};acts.appendChild(delBtn)}

    row.onclick=()=>openTrainingModal(t)
    ap(row,statusBar,main,acts);lb.appendChild(row)
  })
  listCard.appendChild(lb);w.appendChild(listCard)
  return w
}

function openTrainingModal(ex=null){
  let f=ex?{...ex}:{clienteName:'',clienteEmail:'',assunto:'',status:'solicitado',responsavelId:'',responsavelName:'',dataAgendada:'',dataRealizada:'',duracaoMin:'',observacoes:''}
  const ov=el('div','overlay');const mo=el('div','modal',{maxWidth:'560px'})
  const mh=ap(el('div','modal-h'),ap(el('div','modal-t'),ex?'Editar treinamento':'Novo treinamento'))
  const x=ap(el('button','modal-x'),'×');x.onclick=()=>ov.remove();mh.appendChild(x)
  const mb=el('div','modal-b')

  // Cliente (do cadastro de clientes + portal)
  const cg=ap(el('div','form-g'),ap(el('label','form-l'),'Cliente'))
  const cs=el('select','')
  // Combinar clientes do cadastro + portal
  const allClients=[
    ...clients.map(c=>({name:c.companyName||c.contactName,email:c.email||'',source:'cadastro',id:c.id})),
    ...((window._portalClients||[]).filter(p=>!clients.find(c=>c.email===p.email)).map(p=>({name:p.email,email:p.email,source:'portal'})))
  ]
  if(allClients.length){
    cs.innerHTML='<option value="">— Selecione o cliente —</option>'+
      allClients.map(c=>`<option value="${c.email||c.name}" data-name="${c.name}">${c.name}${c.email?' ('+c.email+')':''}</option>`).join('')+
      '<option value="__outro__">+ Outro (digitar manualmente)</option>'
  } else {
    cs.innerHTML='<option value="">— Carregando clientes... —</option>'
    getDocs(collection(db,'clientPortal')).then(snap=>{
      const portal=snap.docs.map(d=>d.data())
      window._portalClients=portal
      const list=[...clients.map(c=>({name:c.companyName||c.contactName,email:c.email||''})),...portal.map(p=>({name:p.email,email:p.email}))]
      cs.innerHTML='<option value="">— Selecione o cliente —</option>'+list.map(c=>`<option value="${c.email||c.name}" data-name="${c.name}">${c.name}${c.email?' ('+c.email+')':''}</option>`).join('')+'<option value="__outro__">+ Outro</option>'
      if(f.clienteEmail)cs.value=f.clienteEmail
    })
  }
  if(f.clienteEmail)cs.value=f.clienteEmail
  cg.appendChild(cs)

  // Campo manual de cliente (oculto)
  const manualG=ap(el('div','form-g',{display:'none'}),ap(el('label','form-l'),'Nome do cliente (manual)'))
  const manualI=el('input','');manualI.placeholder='Nome ou empresa';manualI.value=f.clienteName||'';manualI.oninput=e=>f.clienteName=e.target.value;manualG.appendChild(manualI)

  cs.onchange=e=>{
    if(e.target.value==='__outro__'){manualG.style.display='';f.clienteEmail='';f.clienteName=''}
    else{
      manualG.style.display='none'
      f.clienteEmail=e.target.value
      const opt=e.target.selectedOptions[0]
      f.clienteName=opt?.dataset?.name||e.target.value
    }
  }

  // Assunto
  const ag=ap(el('div','form-g'),ap(el('label','form-l'),'Assunto / Tema do treinamento *'))
  const ai=el('input','');ai.placeholder='Ex: Emissão de NF-e, Módulo financeiro...';ai.value=f.assunto||'';ai.oninput=e=>f.assunto=e.target.value;ag.appendChild(ai)

  // Status + Responsável
  const r1=el('div','form-row')
  const stg=ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Status'))
  const sts=el('select','');sts.innerHTML=Object.entries(TRAIN_ST).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('');sts.value=f.status||'solicitado';sts.onchange=e=>f.status=e.target.value;stg.appendChild(sts)
  const rg=ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Responsável (equipe)'))
  const rs=el('select','');rs.innerHTML='<option value="">— Selecione —</option>'+users.map(u=>`<option value="${u.id}">${u.name}</option>`).join('');rs.value=f.responsavelId||'';rs.onchange=e=>{f.responsavelId=e.target.value;f.responsavelName=users.find(u=>u.id===e.target.value)?.name||''};rg.appendChild(rs)
  ap(r1,stg,rg)

  // Datas
  const r2=el('div','form-row')
  const dag=ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Data agendada'))
  const dai=el('input','');dai.type='date';dai.value=f.dataAgendada||'';dai.oninput=e=>f.dataAgendada=e.target.value;dag.appendChild(dai)
  const drg=ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Data realizada'))
  const dri=el('input','');dri.type='date';dri.value=f.dataRealizada||'';dri.oninput=e=>f.dataRealizada=e.target.value;drg.appendChild(dri)
  ap(r2,dag,drg)

  // Duração
  const dug=ap(el('div','form-g'),ap(el('label','form-l'),'Duração (minutos)'))
  const dui=el('input','');dui.type='number';dui.placeholder='Ex: 60';dui.value=f.duracaoMin||'';dui.oninput=e=>f.duracaoMin=e.target.value;dug.appendChild(dui)

  // Observações
  const og=ap(el('div','form-g'),ap(el('label','form-l'),'Observações'))
  const oi=el('textarea','',{resize:'vertical'});oi.rows=3;oi.placeholder='Detalhes do treinamento...';oi.value=f.observacoes||'';oi.oninput=e=>f.observacoes=e.target.value;og.appendChild(oi)

  ap(mb,cg,manualG,ag,r1,r2,dug,og)

  const mf=el('div','modal-f')
  const can=ap(el('button','btn btn-s'),'Cancelar');can.onclick=()=>ov.remove()
  const sv=ap(el('button','btn btn-p'),ex?'Salvar':'Criar')
  sv.onclick=async()=>{
    if(!f.assunto.trim()){ai.style.borderColor='var(--red)';ai.focus();return}
    sv.disabled=true;sv.textContent='Salvando...'
    try{
      const data={clienteName:f.clienteName||'',clienteEmail:f.clienteEmail||'',assunto:f.assunto,status:f.status||'solicitado',responsavelId:f.responsavelId||'',responsavelName:f.responsavelName||'',dataAgendada:f.dataAgendada||'',dataRealizada:f.dataRealizada||'',duracaoMin:f.duracaoMin?Number(f.duracaoMin):null,observacoes:f.observacoes||'',updatedAt:serverTimestamp()}
      if(ex)await updateDoc(doc(db,'trainings',ex.id),data)
      else await addDoc(collection(db,'trainings'),{...data,createdBy:CU.uid,createdByName:CP.name,createdAt:serverTimestamp()})
      ov.remove()
    }catch(e){alert('Erro: '+e.message);sv.disabled=false;sv.textContent=ex?'Salvar':'Criar'}
  }
  ap(mf,can,sv);ap(mo,mh,mb,mf);ov.appendChild(mo);document.body.appendChild(ov)
}

    // Formulário de assinatura
    ap(content,ap(el('p','f12 tc2',{lineHeight:'1.6'}),'Confirme que o treinamento foi realizado e está concluído:'))

    const ng=ap(el('div','form-g'),ap(el('label','form-l'),'Seu nome completo *'))
