    ap(consentRow,cb,cTxt);consentG.appendChild(consentRow)

    const err=ap(el('p','',{fontSize:'12px',color:'var(--red)',display:'none'}),'')
    const sv=ap(el('button','btn btn-p btn-w',{padding:'12px',fontSize:'14px',background:'#2F7D5C'}),'✓ Confirmar treinamento')

    ap(content,ng,eg,ogf,consentG,err,sv)

    sv.onclick=async()=>{
      if(!ni.value.trim()){err.textContent='Digite seu nome.';err.style.display='block';return}
      if(!ei.value.includes('@')){err.textContent='Digite um e-mail válido.';err.style.display='block';return}
      if(!cb.checked){err.textContent='Você precisa concordar para assinar.';err.style.display='block';return}
      err.style.display='none';sv.disabled=true;sv.textContent='Registrando...'
      try{
        await updateDoc(doc(db,'trainings',trainingId),{
          signedAt:new Date().toISOString(),
          signedByName:ni.value.trim(),
          signedByEmail:ei.value.trim(),
          signedComment:oi.value.trim()||'',
          status:'concluido'
        })
        content.innerHTML=''
        ap(content,
          ap(el('div','',{padding:'20px',background:'#EDF7F2',border:'1px solid #B5DCC9',borderRadius:'10px',color:'#2F7D5C',textAlign:'center'}),
            ap(el('div','',{fontSize:'40px',marginBottom:'8px'}),'✓'),
            ap(el('div','',{fontWeight:'700',fontSize:'15px',marginBottom:'4px'}),'Treinamento confirmado!'),
            ap(el('div','f12'),'Obrigado, '+ni.value.trim()+'.')
          )
        )
      }catch(e){err.textContent='Erro: '+e.message;err.style.display='block';sv.disabled=false;sv.textContent='✓ Confirmar treinamento'}
    }
  }catch(e){content.innerHTML='';ap(content,ap(el('p','',{color:'var(--red)'}),'Erro: '+e.message))}
}

// ── RELATÓRIO DE TREINAMENTOS ────────────────────────────────
function openTrainingReport(){
  const ov=el('div','overlay',{alignItems:'flex-start',paddingTop:'16px'})
  const mo=el('div','',{background:'#fff',borderRadius:'14px',width:'100%',maxWidth:'600px',maxHeight:'92vh',overflow:'auto',boxShadow:'0 25px 60px rgba(0,0,0,.3)',margin:'auto'})

  const mh=ap(el('div','modal-h'),ap(el('div','modal-t'),'📊 Relatório de Treinamentos'))
  const x=ap(el('button','modal-x'),'×');x.onclick=()=>ov.remove();mh.appendChild(x)
  const mb=el('div','modal-b')

  ap(mb,ap(el('p','f12 tc2 mb12'),'Configure os filtros do relatório:'))

  // Período
  const r1=el('div','form-row')
  const dig=ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Data inicial'))
  const dii=el('input','');dii.type='date';dig.appendChild(dii)
  const dfg=ap(el('div','form-g',{marginBottom:'0'}),ap(el('label','form-l'),'Data final'))
  const dfi=el('input','');dfi.type='date';dfg.appendChild(dfi)
  ap(r1,dig,dfg);mb.appendChild(r1)

  // Cliente
  const cg=ap(el('div','form-g'),ap(el('label','form-l'),'Cliente'))
  const cs=el('select','')
  const uniqueClients=[...new Set(trainings.map(t=>t.clienteName).filter(Boolean))]
  cs.innerHTML='<option value="">Todos os clientes</option>'+uniqueClients.map(c=>`<option value="${c}">${c}</option>`).join('')
  cg.appendChild(cs);mb.appendChild(cg)

  // Colaborador
  const rg=ap(el('div','form-g'),ap(el('label','form-l'),'Colaborador'))
  const rs=el('select','')
  rs.innerHTML='<option value="">Todos os colaboradores</option>'+users.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')
  rg.appendChild(rs);mb.appendChild(rg)

  // Status
  const stg=ap(el('div','form-g'),ap(el('label','form-l'),'Status'))
  const sts=el('select','')
  sts.innerHTML='<option value="">Todos os status</option>'+Object.entries(TRAIN_ST).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join('')
  stg.appendChild(sts);mb.appendChild(stg)

  const mf=el('div','modal-f')
  const can=ap(el('button','btn btn-s'),'Cancelar');can.onclick=()=>ov.remove()
  const gen=ap(el('button','btn btn-p'),'Gerar relatório')
  gen.onclick=()=>{
    const dateFrom=dii.value,dateTo=dfi.value
    const filterCli=cs.value,filterResp=rs.value,filterSt=sts.value

    let data=trainings.filter(t=>{
      if(filterCli&&t.clienteName!==filterCli)return false
      if(filterResp&&t.responsavelId!==filterResp)return false
      if(filterSt&&t.status!==filterSt)return false
      if(dateFrom||dateTo){
        const ref=t.dataRealizada||t.dataAgendada||(t.createdAt?.toDate?.()?.toISOString().slice(0,10))
        if(!ref)return false
        if(dateFrom&&ref<dateFrom)return false
        if(dateTo&&ref>dateTo)return false
      }
      return true
    })

    // Ordenar por data
    data.sort((a,b)=>(a.dataRealizada||a.dataAgendada||'').localeCompare(b.dataRealizada||b.dataAgendada||''))

    ov.remove()
    generateTrainingReportPDF(data,{dateFrom,dateTo,filterCli,filterResp:rs.options[rs.selectedIndex]?.text,filterSt})
  }
  ap(mf,can,gen);ap(mo,mh,mb,mf);ov.appendChild(mo);document.body.appendChild(ov)
}

function generateTrainingReportPDF(data,filters){
  const now=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})
  const totalMin=data.reduce((s,t)=>s+(Number(t.duracaoMin)||0),0)
  const totalHrs=Math.floor(totalMin/60),totalMm=totalMin%60

  // Agrupar por colaborador
  const byUser={}
  data.forEach(t=>{
    const n=t.responsavelName||'Sem responsável'
    if(!byUser[n])byUser[n]={total:0,minutos:0,concluidos:0}
    byUser[n].total++
    byUser[n].minutos+=Number(t.duracaoMin)||0
    if(t.status==='concluido')byUser[n].concluidos++
  })

  const rows=data.map((t,i)=>{
    const st=TRAIN_ST[t.status]||TRAIN_ST.solicitado
    return `<tr style="background:${i%2===0?'#fff':'#F8FAFC'}">
      <td>${t.clienteName||'—'}</td>
      <td style="font-weight:600">${t.assunto||'—'}</td>
      <td>${t.responsavelName||'—'}</td>
      <td><span style="background:${st.bg};color:${st.c};padding:2px 7px;border-radius:4px;font-size:10px;border:1px solid ${st.bd}">${st.l}</span></td>
      <td style="text-align:center;font-size:10px">${t.dataAgendada?new Date(t.dataAgendada+'T00:00').toLocaleDateString('pt-BR'):'—'}</td>
      <td style="text-align:center;font-size:10px">${t.dataRealizada?new Date(t.dataRealizada+'T00:00').toLocaleDateString('pt-BR'):'—'}</td>
      <td style="text-align:center">${t.duracaoMin||'—'}</td>
      <td style="text-align:center;font-size:11px">${t.signedAt?'✓ '+(t.signedByName||'sim'):'—'}</td>
    </tr>`
  }).join('')

  const byUserRows=Object.entries(byUser).map(([n,d])=>`<tr><td>${n}</td><td style="text-align:center">${d.total}</td><td style="text-align:center">${d.concluidos}</td><td style="text-align:center">${Math.floor(d.minutos/60)}h ${d.minutos%60}min</td></tr>`).join('')

  const filtTxt=[
    filters.dateFrom&&'De '+new Date(filters.dateFrom+'T00:00').toLocaleDateString('pt-BR'),
    filters.dateTo&&'até '+new Date(filters.dateTo+'T00:00').toLocaleDateString('pt-BR'),
    filters.filterCli&&'Cliente: '+filters.filterCli,
    filters.filterResp&&filters.filterResp!=='Todos os colaboradores'&&'Colaborador: '+filters.filterResp,
    filters.filterSt&&'Status: '+(TRAIN_ST[filters.filterSt]?.l||filters.filterSt)
  ].filter(Boolean).join(' · ')||'Todos os registros'

  const pw=window.open('','_blank')
  if(!pw){alert('Permita pop-ups.');return}
  pw.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
  <title>Relatório de Treinamentos — ${APP_NAME}</title>
  <style>
    @page{size:A4 landscape;margin:1cm}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;font-size:11px;color:#1C2433;padding:0}
    h1{font-size:18px;font-weight:700;margin-bottom:3px;color:#1E4E79}
    .sub{font-size:11px;color:#5A6678;margin-bottom:14px}
    .filt{font-size:10px;background:#EDF3F8;padding:6px 10px;border-radius:6px;margin-bottom:14px;color:#1E4E79}
    .stats{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .stat{background:#F4F6F8;border-left:3px solid #1E4E79;padding:9px 13px;border-radius:6px;min-width:110px}
    .stat-v{font-size:18px;font-weight:700;color:#1E4E79;line-height:1}
    .stat-l{font-size:9px;color:#5A6678;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
    h2{font-size:13px;font-weight:600;margin:14px 0 8px;color:#1C2433}
    table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:14px}
    th{background:#1C2433;color:#fff;padding:7px 9px;text-align:left;font-weight:600;font-size:10px;text-transform:uppercase}
    td{padding:6px 9px;border-bottom:1px solid #DDE3EA;vertical-align:top}
    .footer{margin-top:14px;font-size:9px;color:#94A0B0;text-align:right;border-top:1px solid #DDE3EA;padding-top:6px}
  </style></head><body>
  <h1>📊 Relatório de Treinamentos — ${APP_NAME}</h1>
  <div class="sub">Gerado em ${now} · ${data.length} treinamento${data.length!==1?'s':''}</div>
  <div class="filt"><strong>Filtros:</strong> ${filtTxt}</div>
  <div class="stats">
    <div class="stat"><div class="stat-v">${data.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-v">${data.filter(t=>t.status==='concluido').length}</div><div class="stat-l">Concluídos</div></div>
    <div class="stat"><div class="stat-v">${data.filter(t=>t.status==='solicitado'||t.status==='agendado'||t.status==='andamento').length}</div><div class="stat-l">Pendentes</div></div>
    <div class="stat"><div class="stat-v">${totalHrs}h ${totalMm}min</div><div class="stat-l">Tempo total</div></div>
    <div class="stat"><div class="stat-v">${data.filter(t=>t.signedAt).length}</div><div class="stat-l">Assinados</div></div>
  </div>
  ${byUserRows?`<h2>👥 Resumo por Colaborador</h2>
  <table>
    <thead><tr><th>Colaborador</th><th>Total</th><th>Concluídos</th><th>Tempo</th></tr></thead>
    <tbody>${byUserRows}</tbody>
  </table>`:''}
  <h2>📋 Lista detalhada</h2>
  <table>
    <thead><tr><th>Cliente</th><th>Assunto</th><th>Responsável</th><th>Status</th><th>Agendada</th><th>Realizada</th><th>Min.</th><th>Assinado</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" style="text-align:center;padding:20px;color:#94A0B0">Nenhum registro encontrado para os filtros selecionados</td></tr>'}</tbody>
  </table>
  <div class="footer">${APP_NAME} · ${now}</div>
  <script>window.onload=()=>window.print()<\/script></body></html>`)
  pw.document.close()
}

function buildPortalPanel(){
  const w=el('div','page')
  ap(w,ap(el('h2','mb16',{fontSize:'16px',fontWeight:'700'}),'Portal do Cliente'))

  // Link do portal
  const portalUrl=window.location.origin+window.location.pathname+'?portal'
  const linkCard=el('div','card mb16')
  ap(linkCard.appendChild(el('div','card-h')),ap(el('div','card-t'),'🔗 Link para compartilhar com clientes'))
  const lb=el('div','card-b')
  ap(lb,ap(el('p','f12 tc2 mb8'),'Envie este link para seus clientes acessarem as atualizações do sistema:'))
  const linkRow=el('div','flex g8 mb8')
  const linkBox=ap(el('input','',{background:'#F8FAFC',fontSize:'12px',fontWeight:'500'}))
  linkBox.value=portalUrl;linkBox.readOnly=true
  const copyBtn=ap(el('button','btn btn-p btn-sm'),'📋 Copiar link')
  copyBtn.onclick=()=>{navigator.clipboard.writeText(portalUrl);copyBtn.textContent='✓ Copiado!';setTimeout(()=>copyBtn.textContent='📋 Copiar link',2000)}
  ap(linkRow,linkBox,copyBtn);lb.appendChild(linkRow)
  ap(lb,ap(el('p','f11 tc3'),'Os clientes precisam informar e-mail e aceitar os termos LGPD para acessar.'))
  linkCard.appendChild(lb)
  w.appendChild(linkCard)

  // Lista de clientes
  const clientCard=el('div','card')
  ap(clientCard.appendChild(el('div','card-h')),ap(el('div','card-t'),'👥 Clientes cadastrados'))
  const cb2=el('div','card-b')
  ap(cb2,ap(el('p','f12 tc2'),'Carregando...'))

  getDocs(query(collection(db,'clientPortal'),orderBy('lastAccess','desc'))).then(snap=>{
    cb2.innerHTML=''
    if(snap.empty){ap(cb2,ap(el('div','empty',{padding:'20px 0'}),ap(el('div','empty-t'),'Nenhum cliente acessou ainda.')));return}
    snap.docs.forEach(d=>{
      const c={id:d.id,...d.data()}
      const row=el('div','',{padding:'12px 0',borderBottom:'1px solid var(--brd)',display:'flex',alignItems:'center',gap:'12px'})
      const av2=ap(el('div','av',{width:'36px',height:'36px',background:'var(--bluel)',color:'var(--blue)',fontSize:'13px',fontWeight:'700'}),c.email?.charAt(0).toUpperCase()||'?')
      const info=el('div','',{flex:'1'})
      ap(info,ap(el('div','fw6 f13'),c.email||''),ap(el('div','f11 tc2'),c.phone?'📱 '+c.phone:'Sem telefone'))
      const meta=el('div','',{textAlign:'right'})
      const lastAcc=c.lastAccess?new Date(c.lastAccess).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—'
      ap(meta,ap(el('div','f11 tc2'),`${c.accessCount||1} acesso${(c.accessCount||1)!==1?'s':''}`),ap(el('div','f11 tc3'),'Último: '+lastAcc))
      const delBtn=ap(el('button','btn btn-d btn-xs'),'Excluir dados')
      delBtn.onclick=async()=>{if(confirm('Excluir dados de '+c.email+'? Esta ação atende à solicitação LGPD e não pode ser desfeita.')){await deleteDoc(doc(db,'clientPortal',c.id));row.remove()}}
      ap(row,av2,info,meta,delBtn);cb2.appendChild(row)
    })
  }).catch(e=>ap(cb2,ap(el('p','',{color:'var(--red)'}),'Erro: '+e.message)))

  clientCard.appendChild(cb2);w.appendChild(clientCard)
  return w
}

// ── AUTH ─────────────────────────────────────────────────────
onAuthStateChanged(auth,async fu=>{
  // Modo assinatura de treinamento (cliente externo)
  const signId=checkTrainingSignMode()
  if(signId){renderTrainingSign(signId);return}
  // Portal mode: cliente externo
  if(checkPortalMode()){renderPortal();return}
  if(fu){const s=await getDoc(doc(db,'users',fu.uid));if(s.exists()){CU=fu;CP=s.data();await loadBlocks();subscribe();renderApp()}else renderLogin()}
  else{unsubs.forEach(u=>u());CU=CP=null;demands=notices=prospects=updates=[];renderLogin()}
})
